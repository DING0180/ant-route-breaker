<script>
(() => {
  'use strict';

  const retryHints = {
    'try-cube-six':'被遮住的面也要算。转一圈，再看下面。',
    'try-plane-line':'三条路的起点和终点一样。看哪条没有绕路。',
    'try-cross-faces':'回放一次，停在蚂蚁跨棱前后各看一眼。',
    'try-cross-surface':'想想蚂蚁的脚一直踩在哪里。',
    'try-grid-compare':'两条路的小段一样长，看看哪条的段数少。',
    'try-grid-mixed':'先比一比一格的边和对角线。',
    'try-unfold-why':'把两个面放平，想想蚂蚁怎样从 A 直达 B。',
    'try-cuboid-diagonal':'每一小段都穿过一个同样大的方格。',
    'try-cuboid-mixed':'从两条路各去掉一条边和一条对角线，再比。',
    'try-cuboid-nets':'切换两条路线，对比模型给出的长度。',
    'try-cuboid-shape':'转一转，比较一个端面和一个侧面。',
  };

  function activity(id) {
    let turned = false, crossed = false, movedPoint = false, laidFlat = false, sawStraight = false;
    const viewed = new Set();
    const paired = (action, steps) => ({
      action, steps, count:steps.filter(step => step.done).length, total:steps.length,
    });
    const step = (label, done) => ({label,done});
    return {
      orbit() { turned = true; },
      reset() { viewed.clear(); },
      inspect(snapshot, variant, marksByRoute, model) {
        if (id === 'faces') return {count:new Set(snapshot.faces).size,total:6,action:'点亮每一个面。转一转，找藏起来的面！'};
        if (id === 'cross') {
          const [start, hinge] = snapshot.points;
          const toHinge = Math.hypot(...start.map((coordinate,axis) => coordinate - hinge[axis]));
          crossed ||= snapshot.progress * snapshot.length > toHinge;
          return paired(turned ? '播放蚂蚁，看看它怎么爬到第二个面。' : '拖动或按方向键，换一个角度。',
            [step('转动方块',turned),step('看蚂蚁过棱',crossed)]);
        }
        if (id === 'unfold') {
          movedPoint ||= !snapshot.solved && Math.abs(snapshot.cross - .25) >= .06;
          laidFlat ||= snapshot.fold >= .98;
          sawStraight ||= snapshot.solved && snapshot.fold >= .98;
          const action = !movedPoint ? '拖动 P，看看路线长短有什么变化。'
            : snapshot.fold < .98 ? '把两个面展开，看路线怎样变化。' : '点「验证线段 AB」，看看路线怎样变直。';
          return paired(action,[step('移动 P',movedPoint),step('把两面展开',laidFlat),step('看路线变直',sawStraight)]);
        }
        if (variant === 'shape') return {count:snapshot.stretch >= .99 ? 1 : 0,total:1,action:'拖动拉伸滑块，把正方体变成长方体。'};
        if (variant === 'nets') {
          viewed.add(snapshot.route);
          return paired('切换两条路线，记住各自的长度。', [step('看路线①',viewed.has(0)),step('看路线②',viewed.has(1))]);
        }
        const finished = i => (marksByRoute[i]?.length || 0) === model.routes[i].points.length - 1;
        return paired('点亮每条路线的所有小段，两条都要找齐。',
          [step('数完路线①',finished(0)),step('数完路线②',finished(1))]);
      },
    };
  }

  function panel(el) {
    const title = el('span',{class:'quest-status-title'},'动手进度');
    const count = el('span');
    const progress = el('progress',{class:'quest-meter',value:'0',max:'1','aria-label':'动手任务进度'});
    const action = el('p',{class:'quest-action'});
    const steps = el('ul',{class:'quest-steps'});
    const root = el('div',{class:'quest-status',role:'status', 'aria-live':'polite'},
      el('div',{class:'quest-status-head'},title,count),progress,action,steps);
    let last = '';
    return {root, update(evidence, ready, passed) {
      const change = JSON.stringify([evidence,ready,passed]);
      if (change === last) return;
      last = change;
      root.classList.toggle('is-ready',ready);
      title.textContent = passed ? '本关已通关' : ready ? '动手挑战完成' : '动手进度';
      count.textContent = `${ready ? evidence.total : evidence.count} / ${evidence.total}`;
      progress.max = evidence.total;
      progress.value = ready ? evidence.total : evidence.count;
      action.textContent = passed ? '可以继续下一关。' : ready ? '题目已解锁，选出你的答案。' : evidence.action;
      steps.replaceChildren(...(evidence.steps || []).map(s => el('li',{class:s.done || ready ? 'is-done' : ''},`${s.done || ready ? '✓ ' : ''}${s.label}`)));
    }};
  }

  function bloom(anchor, big = false) {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const bounds = anchor.getBoundingClientRect();
    const overlay = document.createElement('div');
    overlay.className = 'quest-reward';
    overlay.setAttribute('aria-hidden', 'true');
    const center = (start,size,limit) => Math.min(limit-35,Math.max(35,start+size/2));
    overlay.style.setProperty('--origin-x', `${center(bounds.x,bounds.width,innerWidth)}px`);
    overlay.style.setProperty('--origin-y', `${center(bounds.y,bounds.height,innerHeight)}px`);
    const amount = big ? 24 : 10;
    for (let i=0;i<amount;i++) {
      const flower = document.createElement('span');
      flower.className = 'quest-bloom';
      const angle = Math.PI*2*i/amount;
      const radius = (big ? 116 : 64) + i%5*9;
      if (i%4 === 0) flower.textContent = '🌼';
      flower.style.setProperty('--x',`${Math.cos(angle)*radius}px`);
      flower.style.setProperty('--y',`${Math.sin(angle)*radius-22}px`);
      flower.style.setProperty('--angle',`${i%2 ? -38 : 48}deg`);
      flower.style.setProperty('--delay',`${i%6*24}ms`);
      overlay.append(flower);
    }
    document.body.append(overlay);
    setTimeout(() => overlay.remove(),1200);
  }

  window.AntQuests = { activity, panel, bloom, retryHints };
})();

</script>
<script>
(() => {
  'use strict';

  const fruit = ['🍊', '🍓', '🍐', '🍒', '🍎', '🫐'];
  const trail = [[14,87], [24,84], [44,81], [65,78], [84,72], [86,60], [72,55], [51,51], [31,47], [18,42], [23,30], [51,24], [80,17]];
  const aspect = 1.41;
  const distance = ([x1, y1], [x2, y2]) => Math.hypot(x2 - x1, (y2 - y1) / aspect);
  const segments = trail.slice(1).map((point, index) => distance(trail[index], point));
  const trailLength = segments.reduce((total, segment) => total + segment, 0);

  function trailPoint(progress) {
    let remaining = trailLength * progress;
    for (let i = 0; i < segments.length; i++) {
      if (remaining <= segments[i]) {
        const part = remaining / segments[i];
        return trail[i].map((position, axis) => position + (trail[i + 1][axis] - position) * part);
      }
      remaining -= segments[i];
    }
    return trail[trail.length - 1];
  }

  function place(element, [x, y]) {
    element.style.setProperty('--trail-x', `${x}%`);
    element.style.setProperty('--trail-y', `${y}%`);
  }

  function element(tag, className, text) {
    const node = document.createElement(tag);
    node.className = className;
    if (text) node.textContent = text;
    return node;
  }

  function antArt(img) {
    const picture = element('span', 'fruit-trail-ant-art');
    const fallback = element('span', 'fruit-trail-fallback', '🐜');
    picture.append(fallback);
    if (/^data:image\/(?:png|jpeg|webp|gif|avif);base64,/i.test(img || '')) {
      const model = element('img', 'fruit-trail-mascot');
      model.alt = '';
      model.draggable = false;
      model.addEventListener('load', () => picture.classList.add('has-art'), {once:true});
      model.src = img;
      picture.append(model);
    }
    return picture;
  }

  function mount(root, {img, total, initial = 0, open = true} = {}) {
    const maximum = Math.min(100, Math.max(1, Math.floor(Number(total)) || 1));
    const clamp = count => Math.min(maximum, Math.max(0, Math.floor(Number(count)) || 0));
    const motion = window.matchMedia('(prefers-reduced-motion: reduce)');
    const board = element('section', `fruit-trail${open ? '' : ' is-compact'}`);
    board.setAttribute('aria-label', '蚂蚁的水果进度');
    const header = element('div', 'fruit-trail-head');
    const label = element('strong', 'fruit-trail-label', '蚂蚁果园');
    const tally = element('span', 'fruit-trail-tally');
    const glyph = element('span', 'fruit-trail-glyph', fruit[0]);
    glyph.setAttribute('aria-hidden', 'true');
    const output = element('output', 'fruit-trail-count');
    tally.append(glyph, output);
    header.append(label, tally);
    board.append(header);

    const track = element('div', 'fruit-trail-track');
    track.setAttribute('aria-hidden', 'true');
    const rider = element('div', 'fruit-trail-rider');
    rider.append(antArt(img));
    const goals = Array.from({length:maximum + 1}, (_, step) => trailPoint(step / maximum));
    const stops = goals.map((point, index) => {
      const stop = element('span', index === maximum ? 'fruit-trail-stop is-summit' : 'fruit-trail-stop');
      place(stop, point);
      track.append(stop);
      return stop;
    });
    for (let i = trail.length - 2; i >= 0; i--) {
      const [x, y] = trail[i];
      const [nextX, nextY] = trail[i + 1];
      const segment = element('span', 'fruit-trail-segment');
      place(segment, trail[i]);
      segment.style.width = `${segments[i]}%`;
      segment.style.transform = `rotate(${Math.atan2((nextY - y) / aspect, nextX - x)}rad)`;
      track.prepend(segment);
    }
    const summit = element('span', 'fruit-trail-summit', '🍑');
    place(summit, trail[trail.length - 1]);
    track.append(summit, rider);
    if (open) board.append(track,element('p','fruit-trail-tip','答对一题，收一颗果子'));
    else {
      const mini = antArt(img);
      mini.classList.add('fruit-trail-mini');
      mini.setAttribute('aria-hidden', 'true');
      header.prepend(mini);
    }
    root.append(board);

    let shown = clamp(initial), target = shown, stepTimer = 0, snackTimer = 0, snack = null;

    function show(count, duration = 0) {
      shown = count;
      rider.style.setProperty('--trail-move', `${duration}ms`);
      place(rider, goals[count]);
      output.textContent = `${count}/${maximum}`;
      output.setAttribute('aria-label', `吃到 ${count} 个水果，共 ${maximum} 个`);
      stops.forEach((stop, i) => {
        stop.classList.toggle('is-passed', i <= count);
        stop.classList.toggle('is-current', i === count);
      });
      board.classList.toggle('is-complete', count === maximum);
      glyph.textContent = fruit[Math.max(0, count - 1) % fruit.length];
    }

    function clearSnack() {
      window.clearTimeout(snackTimer);
      snack?.remove();
      snack = null;
    }

    function feed(count) {
      clearSnack();
      snack = element('span', 'fruit-trail-snack', fruit[(count - 1) % fruit.length]);
      snack.setAttribute('aria-hidden', 'true');
      (open ? rider : tally).append(snack);
      snackTimer = window.setTimeout(clearSnack, 370);
    }

    function takeStep() {
      stepTimer = 0;
      if (shown >= target) return;
      const pending = target - shown;
      const duration = pending > 3 ? 96 : 180;
      const next = shown + 1;
      show(next, duration);
      stepTimer = window.setTimeout(() => {
        feed(next);
        if (shown < target) stepTimer = window.setTimeout(takeStep, pending > 3 ? 42 : 92);
        else stepTimer = 0;
      }, duration);
    }

    function snap() {
      window.clearTimeout(stepTimer);
      stepTimer = 0;
      clearSnack();
      show(target);
    }

    const onMotionChange = event => { if (event.matches) snap(); };
    motion.addEventListener('change', onMotionChange);
    show(shown);

    return {
      update({count, animate = false} = {}) {
        if (count === undefined) return;
        target = clamp(count);
        if (!animate || motion.matches || target < shown) snap();
        else if (!stepTimer && target > shown) takeStep();
      },
      destroy() {
        window.clearTimeout(stepTimer);
        clearSnack();
        motion.removeEventListener('change', onMotionChange);
        board.remove();
      },
    };
  }

  window.AntFruitTrail = {mount};
})();

</script>
<script>
(function () {
  'use strict';

  const sideOrder = ['before', 'after', 'above', 'below'];
  const targetClass = 'ant-guide-target';
  const padding = 8;
  const gap = 12;
  const clamp = (value, low, high) => Math.max(low, Math.min(high, value));

  function overlapping(a, b) {
    return a.left < b.right && a.right > b.left && a.top < b.bottom && a.bottom > b.top;
  }

  function viewportBounds() {
    const viewport = window.visualViewport;
    const mast = document.querySelector('.mobile-bar,.mast');
    const rail = document.querySelector('.course-rail')?.getBoundingClientRect();
    const left = (viewport?.offsetLeft || 0) + padding, top = (viewport?.offsetTop || 0) + padding;
    const width = viewport?.width || window.innerWidth, height = viewport?.height || window.innerHeight;
    const mastBottom = mast?.getBoundingClientRect().bottom || 0;
    const belowMast = mastBottom < top + height * .45 ? mastBottom + 4 : top;
    const besideRail = rail && rail.right - left < width * .44 ? rail.right + padding : left;
    return {
      left: Math.max(left, besideRail),
      top: Math.max(top, belowMast),
      right: left + width - 2 * padding,
      bottom: top + height - 2 * padding,
    };
  }

  function position(side, x, y, w, h) {
    return { side, left: x, top: y, right: x + w, bottom: y + h, width: w, height: h };
  }

  function inside(box, area) {
    return box.left >= area.left && box.right <= area.right && box.top >= area.top && box.bottom <= area.bottom;
  }

  function alternatives(target, w, h, area, sides) {
    const centerX = (target.left + target.right) / 2;
    const centerY = (target.top + target.bottom) / 2;
    const xs = [centerX - w / 2, target.left, target.right - w];
    const ys = [centerY - h / 2, target.top, target.bottom - h];
    return sides.flatMap(side => {
      if (side === 'above' || side === 'below') {
        const y = side === 'above' ? target.top - h - gap : target.bottom + gap;
        return xs.map(x => position(side, clamp(x, area.left, area.right - w), y, w, h));
      }
      const x = side === 'before' ? target.left - w - gap : target.right + gap;
      return ys.map(y => position(side, x, clamp(y, area.top, area.bottom - h), w, h));
    });
  }

  function canvasCorners(canvas, target, w, h, area, kind) {
    if (!canvas || h > 52 || w > canvas.width * .74) return [];
    const left = Math.max(canvas.left + 7, area.left);
    const right = Math.min(canvas.right - w - 7, area.right - w);
    const fromBottom = kind !== 'canvas' && target.top >= canvas.bottom;
    const top = fromBottom ? canvas.bottom - h - 4 : canvas.top + 4;
    // Centering on a control gives the caret a short, clear line to its target.
    const ideal = clamp((target.left + target.right - w) / 2, left, right);
    const side = fromBottom ? 'above' : 'corner';
    if (right < left) return [];
    return (kind === 'canvas' ? [left, right] : [ideal, left, right]).map(x => position(side, x, top, w, h));
  }

  function mount(lab, { img } = {}) {
    const bubble = document.createElement('aside');
    bubble.className = 'ant-guide';
    bubble.hidden = true;
    bubble.setAttribute('role', 'status');
    bubble.setAttribute('aria-live', 'polite');
    bubble.setAttribute('aria-atomic', 'true');
    const image = document.createElement('img');
    image.className = 'ant-guide__face';
    image.alt = '';
    image.draggable = false;
    if (img) image.src = img;
    const words = document.createElement('span');
    words.className = 'ant-guide__words';
    const tail = document.createElement('span');
    tail.className = 'ant-guide__tail';
    tail.setAttribute('aria-hidden', 'true');
    bubble.append(...(img ? [image, words, tail] : [words, tail]));
    document.body.append(bubble);

    const viewport = window.visualViewport;
    const reducedMotion = window.matchMedia?.('(prefers-reduced-motion: reduce)');
    let active, frame, motionTimeout, lastX, lastY;
    let move = false, positioned = false, destroyed = false;
    const observer = new ResizeObserver(queue);
    observer.observe(lab);
    if (document.body !== lab) observer.observe(document.body);
    window.addEventListener('resize', queue, { passive: true });
    window.addEventListener('scroll', queue, { passive: true, capture: true });
    viewport?.addEventListener('resize', queue, { passive: true });
    viewport?.addEventListener('scroll', queue, { passive: true });

    function queue() {
      if (!frame && active && !destroyed) frame = requestAnimationFrame(update);
    }

    function stopMotion() {
      clearTimeout(motionTimeout);
      delete bubble.dataset.moving;
    }

    function conceal() {
      stopMotion();
      bubble.hidden = true;
      positioned = false;
    }

    function obstacles(target, kind) {
      const scope = lab.contains(target) ? lab : (target.closest('.content,.exit-layout') || target.parentElement);
      const objects = new Set([
        ...lab.querySelectorAll('button, label, input, select, textarea, summary, canvas, .lab-title, .lab-hint, .lab-readout, .question legend'),
        ...(scope && scope !== lab ? scope.querySelectorAll('button, label, input, select, textarea, summary, .question legend') : []),
      ]);
      return [...objects].filter(object => object !== target && !target.contains(object) && !object.contains(target))
        .filter(object => (kind !== 'canvas' && kind !== 'pin') || object.tagName !== 'CANVAS')
        .map(object => object.getBoundingClientRect()).filter(r => r.width && r.height);
    }

    function update() {
      frame = undefined;
      if (!active || destroyed) return;
      if (!active.target.isConnected) { hide(); return; }
      const target = active.target.getBoundingClientRect();
      const area = viewportBounds();
      if (!target.width || !target.height || !overlapping(target, area)) { conceal(); return; }

      const blocked = obstacles(active.target, active.kind);
      const preferredSides = [active.side, ...sideOrder.filter(side => side !== active.side)];
      const screen = (active.target.matches('canvas') ? active.target : active.target.querySelector('canvas')) || lab.querySelector('canvas');
      const screenRect = screen?.getBoundingClientRect();
      const avoid = (box, corner = false) => inside(box, area) && blocked.every(obstacle =>
        (corner && screenRect && obstacle.left === screenRect.left && obstacle.top === screenRect.top) || !overlapping(obstacle, box));

      bubble.hidden = false;
      bubble.style.maxWidth = `${Math.min(240, area.right - area.left)}px`;
      bubble.toggleAttribute('data-compact', false);
      let w = bubble.offsetWidth;
      let h = bubble.offsetHeight;
      let next = active.kind === 'canvas'
        ? canvasCorners(screenRect, target, w, h, area, active.kind).find(box => avoid(box, true))
        : null;
      if (!next) next = alternatives(target, w, h, area, preferredSides).find(box => avoid(box));
      if (!next && active.kind !== 'question') {
        bubble.toggleAttribute('data-compact', true);
        w = bubble.offsetWidth;
        h = bubble.offsetHeight;
        next = alternatives(target, w, h, area, preferredSides).find(box => avoid(box)) ||
          (active.kind === 'pin' ? null : canvasCorners(screenRect, target, w, h, area, active.kind)
            .find(box => avoid(box, true) && (active.kind === 'canvas' || !overlapping(box, target))));
      }
      if (!next) { conceal(); return; }

      const x = Math.round(next.left), y = Math.round(next.top);
      const animate = move && positioned && !reducedMotion?.matches;
      if (animate) {
        stopMotion();
        bubble.dataset.moving = '';
        motionTimeout = setTimeout(stopMotion, 460);
      } else if (!move && (x !== lastX || y !== lastY) && bubble.hasAttribute('data-moving')) {
        // Scroll and resize already move the anchor. Only ease a teaching cue between actions.
        stopMotion();
      }
      const offset = next.side === 'above' || next.side === 'below'
        ? clamp((target.left + target.right) / 2 - x, 12, w - 12)
        : clamp((target.top + target.bottom) / 2 - y, 10, h - 10);
      bubble.dataset.side = next.side;
      bubble.style.setProperty('--ant-tail', `${offset}px`);
      bubble.style.transform = `translate3d(${x}px, ${y}px, 0)`;
      lastX = x;
      lastY = y;
      move = false;
      positioned = true;
    }

    function point({ target, text, side = 'before', kind = 'button' }) {
      if (destroyed) return;
      if (!target?.getBoundingClientRect || !text) { hide(); return; }
      if (active?.target === target && active?.text === text && active.side === side && active.kind === kind) {
        queue();
        return;
      }
      if (active?.target !== target) {
        if (active) {
          observer.unobserve(active.target);
          active.target.classList.remove(targetClass);
        }
        observer.observe(target);
      }
      target.classList.toggle(targetClass, kind !== 'pin');
      move = active?.target !== target || active?.text !== text;
      active = { target, text, side: sideOrder.includes(side) ? side : 'before', kind };
      if (words.textContent !== text) words.textContent = text;
      queue();
    }

    function hide() {
      if (active) {
        active.target.classList.remove(targetClass);
        observer.unobserve(active.target);
      }
      active = undefined;
      if (frame) cancelAnimationFrame(frame);
      frame = undefined;
      move = false;
      conceal();
    }

    function destroy() {
      hide();
      destroyed = true;
      observer.disconnect();
      window.removeEventListener('resize', queue);
      window.removeEventListener('scroll', queue, true);
      viewport?.removeEventListener('resize', queue);
      viewport?.removeEventListener('scroll', queue);
      bubble.remove();
    }

    return { point, hide, destroy };
  }

  window.AntGuide = { mount };
})();

</script>
<script>
(() => {
  'use strict';

  const fruits = ['🍊', '🍓', '🍐', '🍒', '🍎', '🍑'];
  const runs = new WeakMap();

  function element(tag, name, text) {
    const node = document.createElement(tag);
    node.className = name;
    if (text) node.textContent = text;
    return node;
  }

  function makeRider(img) {
    const rider = element('span', 'answer-fruit-rider');
    rider.setAttribute('aria-hidden', 'true');
    const mascot = element('span', 'answer-fruit-mascot');
    mascot.append(element('span', 'answer-fruit-fallback', '🐜'));
    if (/^data:image\/(?:png|jpeg|webp|gif|avif);base64,/i.test(img || '')) {
      const picture = element('img', 'answer-fruit-picture');
      picture.alt = '';
      picture.draggable = false;
      picture.addEventListener('load', () => mascot.classList.add('has-picture'), {once:true});
      picture.src = img;
      mascot.append(picture);
    }
    rider.append(mascot);
    return rider;
  }

  function play(root, {img, count} = {}) {
    const received = Number(count);
    const index = Number.isFinite(received) ? Math.max(1, Math.floor(received)) : 1;
    const previous = runs.get(root);
    if (previous?.strip.parentNode === root && (previous.active || previous.index === index)) {
      return previous.promise;
    }
    previous?.strip.remove();
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const strip = element('div', 'answer-fruit');
    strip.dataset.phase = reduced ? 'done' : 'climb';
    const trail = element('span', 'answer-fruit-path');
    const start = element('span', 'answer-fruit-stone');
    const perch = element('span', 'answer-fruit-leaf');
    const treat = element('span', 'answer-fruit-treat', fruits[(index - 1) % fruits.length]);
    for (const decoration of [trail, start, perch, treat]) decoration.setAttribute('aria-hidden', 'true');
    const status = element('output', 'answer-fruit-status');
    status.setAttribute('aria-live', 'polite');
    strip.append(trail, start, perch, treat, makeRider(img), status);
    root.append(strip);

    const run = {active: true, index, strip, promise: null};
    run.promise = new Promise(resolve => {
      function showReward() {
        strip.dataset.phase = 'done';
        status.textContent = '水果 +1';
      }
      function complete() {
        run.active = false;
        resolve(strip);
      }
      if (reduced) {
        showReward();
        window.setTimeout(complete, 220);
      } else {
        window.setTimeout(() => { strip.dataset.phase = 'eat'; }, 790);
        window.setTimeout(showReward, 1160);
        window.setTimeout(complete, 1440);
      }
    });
    runs.set(root, run);
    return run.promise;
  }

  window.AntAnswerFruit = {play};
})();

</script>
<script>
(function () {
  'use strict';

  const dimensions = [4, 4, 4];
  const planes = { front: [2, 4], back: [2, 0], right: [0, 4], left: [0, 0], top: [1, 4], bottom: [1, 0] };
  const sampleGap = 13;
  const maxSegments = 180;
  const distance = (a, b) => Math.hypot(...a.map((n, i) => n - b[i]));

  function connect(from, to) {
    if (from.face === to.face) return [{ point: to.point, face: from.face }];
    const [fromAxis, fromValue] = planes[from.face];
    const [toAxis, toValue] = planes[to.face];
    if (fromAxis === toAxis) return null;

    // In the two unfolded faces, the distance to the shared edge determines the crossing ratio.
    const alongEdge = 3 - fromAxis - toAxis;
    const fromEdge = Math.abs(from.point[toAxis] - toValue);
    const toEdge = Math.abs(to.point[fromAxis] - fromValue);
    const ratio = fromEdge / (fromEdge + toEdge || 1);
    const joint = [];
    joint[fromAxis] = fromValue;
    joint[toAxis] = toValue;
    joint[alongEdge] = from.point[alongEdge] + (to.point[alongEdge] - from.point[alongEdge]) * ratio;
    return [{ point: joint, face: from.face }, { point: to.point, face: to.face }];
  }

  function element(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text) node.textContent = text;
    return node;
  }

  function button(text, action, className) {
    const control = element('button', className, text);
    control.type = 'button';
    control.addEventListener('click', action);
    return control;
  }

  function mount(container, { img } = {}) {
    const root = element('section', 'play-route');
    root.setAttribute('aria-label', '画一条蚂蚁路线');
    const header = element('header', 'play-route__header');
    if (img) {
      const mascot = element('img', 'play-route__mascot');
      mascot.alt = '';
      mascot.src = img;
      mascot.width = mascot.height = 46;
      header.append(mascot);
    }
    const copy = element('div');
    copy.append(element('h2', '', '给蚂蚁画路'), element('p', '', '在方块上点两下，或按住画线。'));
    header.append(copy);

    const lab = element('div', 'lab play-route__lab');
    const viewport = element('div', 'screen play-route__screen');
    const canvas = element('canvas');
    canvas.setAttribute('aria-label', '可画路线的正方体。按方向键可以转动。');
    const startPin = element('span', 'play-route__pin', 'A');
    startPin.hidden = true;
    startPin.setAttribute('aria-hidden', 'true');
    startPin.style.cssText = 'position:absolute;left:0;top:0;pointer-events:none;min-width:24px;height:24px;display:grid;place-items:center;border:2px solid #fff7cc;border-radius:50%;background:#1f573e;color:white;font-weight:800';
    viewport.append(canvas, startPin);

    let scene, firstHit, lastHit, pointerSample, spark, sparkHit, sparkTimer;
    let lastInk = -Infinity, wasPlaying = false;
    let points = [], faces = [], mode = 'draw';
    let instruction = '在任意看得见的面上点一下，放下起点 A。';

    function chooseMode(next) {
      mode = next;
      if (mode === 'draw' && scene.state().playing) scene.pause();
      scene.configure({ surfaceMode: mode });
    }

    function setStatus(text) {
      if (status.textContent !== text) status.textContent = text;
    }

    function takeOutSpark() {
      clearTimeout(sparkTimer);
      spark?.remove();
      spark = sparkHit = null;
    }

    function placeSpark() {
      if (!spark) return;
      const p = scene.locate(sparkHit.face, sparkHit.u, sparkHit.v);
      spark.hidden = !p;
      if (p) {
        spark.style.left = `${p.x}px`;
        spark.style.top = `${p.y}px`;
      }
    }

    function cue(hit, kind) {
      const time = performance.now();
      if (kind === 'ink' && time - lastInk < 115 && spark) {
        sparkHit = hit;
        placeSpark();
        return;
      }
      if (kind === 'ink') lastInk = time;
      takeOutSpark();
      sparkHit = hit;
      spark = element('span', `play-route__spark play-route__spark--${kind}`);
      spark.setAttribute('aria-hidden', 'true');
      spark.style.cssText = 'position:absolute;left:0;top:0;translate:-50% -50%;pointer-events:none';
      viewport.append(spark);
      placeSpark();
      sparkTimer = setTimeout(takeOutSpark, kind === 'finish' ? 760 : 480);
    }

    function redraw(snapshot = scene.state()) {
      const finished = wasPlaying && !snapshot.playing && snapshot.progress === 1 && lastHit;
      wasPlaying = snapshot.playing;
      if (finished) {
        cue(lastHit, 'finish');
        chooseMode('draw');
        return;
      }
      if (snapshot.playing) setStatus('蚂蚁在走。拖动方块，换个角度继续看。');
      else if (faces.length && snapshot.progress === 1) setStatus(mode === 'draw' ? '蚂蚁到终点啦！可以接着画。' : '蚂蚁到终点啦！点「画笔」接着画。');
      else if (mode === 'orbit') setStatus('拖动方块，换个角度看。点「画笔」可以画路线。');
      else setStatus(instruction);
      play.hidden = faces.length === 0;
      clear.hidden = !firstHit;
      const label = snapshot.playing ? '暂停蚂蚁' : snapshot.progress === 1 ? '再走一次' : '播放蚂蚁';
      if (play.textContent !== label) play.textContent = label;
      drawTab.setAttribute('aria-pressed', String(mode === 'draw'));
      orbitTab.setAttribute('aria-pressed', String(mode === 'orbit'));

      const pin = firstHit && !faces.length ? scene.locate(firstHit.face, firstHit.u, firstHit.v) : null;
      startPin.hidden = !pin;
      startPin.style.display = pin ? 'grid' : 'none';
      if (pin) startPin.style.transform = `translate(${pin.x}px,${pin.y}px) translate(-50%,-50%)`;
      placeSpark();
      if (centerHelp.open) {
        for (const [face, control] of centerButtons) control.disabled = !scene.locate(face);
      }
    }

    function addHit(hit) {
      if (!firstHit) {
        firstHit = lastHit = hit;
        points = [hit.point];
        instruction = '起点放好了。再点一个位置，看看路线怎样接过去。';
        cue(hit, 'ink');
        redraw();
        return;
      }
      if (distance(hit.point, lastHit.point) < .015) return;
      const crossed = connect(lastHit, hit);
      if (!crossed) {
        instruction = '这两个面没有共用的棱。换个角度，先接到相邻的面上。';
        redraw();
        return;
      }
      if (faces.length + crossed.length > maxSegments) {
        instruction = '路线画满了。试试让蚂蚁走一遍，或清空重画。';
        redraw();
        return;
      }
      for (const entry of crossed) {
        if (distance(points.at(-1), entry.point) < 1e-8) continue;
        points.push(entry.point);
        faces.push(entry.face);
      }
      lastHit = hit;
      instruction = '路线已经接好。可以接着画，也可以播放蚂蚁。';
      cue(hit, 'ink');
      const route = { id: 'my-ant-route', label: '我画的路', points: [...points], faces: [...faces] };
      scene.configure({ model: { dimensions, routes: [route] }, showRoute: true, showAnt: true });
    }

    function drawSurface(hit, { phase, x, y }) {
      if (phase === 'cancel' || mode !== 'draw') { pointerSample = null; return; }
      if (!hit) {
        if (phase === 'start') {
          instruction = '把笔尖移到方块的面上，再点一下。';
          redraw();
        }
        if (phase !== 'move') pointerSample = null;
        return;
      }
      const moved = !pointerSample || Math.hypot(x - pointerSample.x, y - pointerSample.y) >= sampleGap || pointerSample.face !== hit.face;
      if (phase === 'start' || moved) {
        addHit(hit);
        pointerSample = { x, y, face: hit.face };
      }
      if (phase === 'end') pointerSample = null;
    }

    const actions = element('div', 'lab-controls play-route__actions');
    const drawTab = button('画笔', () => chooseMode('draw'), 'play-route__tab');
    const orbitTab = button('转方块', () => chooseMode('orbit'), 'play-route__tab');
    const play = button('播放蚂蚁', () => {
      if (scene.state().playing) { scene.pause(); return; }
      takeOutSpark();
      chooseMode('orbit');
      scene.play();
    }, 'play-route__play');
    const clear = button('清空路线', () => {
      firstHit = lastHit = pointerSample = null;
      points = [];
      faces = [];
      takeOutSpark();
      mode = 'draw';
      instruction = '在任意看得见的面上点一下，放下起点 A。';
      scene.pause();
      scene.configure({ model: null, showRoute: false, showAnt: false, surfaceMode: mode });
    }, 'play-route__clear');
    const rotate = element('div', 'rotate-group play-route__rotate');
    rotate.setAttribute('aria-label', '转动方块');
    for (const [label, direction, name] of [['←', 'left', '向左转'], ['→', 'right', '向右转'], ['↑', 'up', '向上转'], ['↓', 'down', '向下转']]) {
      const arrow = button(label, () => scene.rotate(direction));
      arrow.setAttribute('aria-label', name);
      rotate.append(arrow);
    }
    actions.append(drawTab, orbitTab, play, clear);

    const status = element('p', 'lab-readout play-route__status');
    status.setAttribute('role', 'status');
    const centerHelp = element('details', 'play-route__center');
    centerHelp.append(element('summary', '', '更多操作'), rotate);
    const centerRow = element('div', 'optional-tools');
    const centerButtons = Object.entries(window.AntScene.faceNumbers).map(([face, number]) => {
      const control = button(`${number} 号面`, () => {
        const p = scene.locate(face);
        if (!p) return;
        chooseMode('draw');
        const hit = scene.surfacePointAt(p.x, p.y);
        if (hit) addHit(hit);
      }, 'compact');
      control.setAttribute('aria-label', `在 ${number} 号面中心落点`);
      centerRow.append(control);
      return [face, control];
    });
    centerHelp.append(centerRow);
    centerHelp.addEventListener('toggle', () => scene.configure({ numberFaces: centerHelp.open }));
    lab.append(viewport, actions, status, centerHelp);
    root.append(header, lab);
    container.append(root);

    scene = window.AntScene.mount(canvas, { mode: 'cube', appearance: 'cover', showAnt: false, showRoute: false,
      facePick: false, surfaceMode: mode, surfaceInput: drawSurface, onChange: redraw });
    redraw();

    return () => {
      takeOutSpark();
      scene.destroy();
      root.remove();
    };
  }

  window.AntPlayRoute = { mount };
})();

</script>
<script>
(() => {

  const storageKey = 'ant-route-play-eggs.v1';
  const eggs = [
    { id:'berry', face:'back', point:[.5, .54], sticker:'🍓', name:'草莓贴纸', message:'找到背面藏着的草莓！' },

  ];

  function node(tag, className, text) {

    if (text) element.textContent = text;

    const book = node('aside', 'play-egg-book');

    book.append(bookHeader, stickers, reveal, message);

    const spots = eggs.map((egg, index) => {
      const spot = control('play-egg-spot', '', '打开发光的彩蛋', () => discover(egg));
      spot.dataset.egg = egg.id;
      spot.hidden = true;
      const spark = node('span', 'play-egg-spark', '✦');
      spark.setAttribute('aria-hidden', 'true');
      spot.append(spark);
      view.append(spot);
      const sticker = control('play-egg-sticker', '', `尚未收集的贴纸 ${index + 1}`, () => discover(egg));
      sticker.dataset.eggReplay = egg.id;
      stickers.append(sticker);
      return {egg, spot, spark, sticker};
    });

    function updateHint() {
      if (hint.hidden) return;
      hint.textContent = found.size === eggs.length ? '两枚都找齐了，点收藏里的贴纸再看一次。'
        : found.has('berry') ? '换到比方块更低的地方，抬头看看。'
        : found.has('nap') ? '转过侧面，再往后转一点。'
        : '方块背后和底下都有地方可以找。';
    }

    function updateCollection() {
      count.textContent = `${found.size} / ${eggs.length}`;
      count.setAttribute('aria-label', `已收集 ${found.size} 枚贴纸，共 ${eggs.length} 枚`);
      for (const [index, {egg, spot, spark, sticker}] of spots.entries()) {
        const hasSticker = found.has(egg.id);
        spot.classList.toggle('is-found', hasSticker);
        spot.setAttribute('aria-label', hasSticker ? `再看${egg.name}` : '打开发光的彩蛋');
        spark.textContent = hasSticker ? egg.sticker : '✦';
        sticker.disabled = !hasSticker;
        sticker.classList.toggle('is-found', hasSticker);
        sticker.textContent = hasSticker ? egg.sticker : '?';
        sticker.setAttribute('aria-label', hasSticker ? `再看${egg.name}` : `尚未收集的贴纸 ${index + 1}`);
      }
      updateHint();
    }

    function discover(egg) {
      if (!found.has(egg.id)) {
        found.add(egg.id);
        saveStickers(found);
      }
      updateCollection();
      const art = node('div', 'play-egg-reveal-art');
      art.dataset.revealedEgg = egg.id;
      art.setAttribute('aria-hidden', 'true');
      art.append(egg.id === 'nap' ? sleepingAnt(img) : node('span', 'play-egg-fruit-art', egg.sticker));
      reveal.replaceChildren(art);
      message.textContent = egg.message;
    }

    function syncSpots() {
      if (!scene) return;
      for (const {egg, spot} of spots) {
        const point = scene.locate(egg.face, ...egg.point);
        spot.hidden = !point;
        if (point) spot.style.setProperty('--egg-position', `${point.x}px, ${point.y}px`);
      }
    }

    root.append(lab, book);
    container.append(root);
    updateCollection();
    scene = window.AntScene.mount(canvas, {
      mode:'cube', appearance:'cover', facePick:false, showAnt:false, showRoute:false, showLabels:false, grid:false,
      onChange:syncSpots,
    });
    syncSpots();
    const resize = new ResizeObserver(syncSpots);
    resize.observe(canvas);
    return () => {
      resize.disconnect();
      scene.destroy();
      root.remove();
    };
  }

  window.AntPlayEggs = {mount};
})();

</script>
<script>
(() => {
  'use strict';

  const fruit = [
    { id: 'berry', emoji: '🍓', name: '草莓', reply: '甜甜的草莓！', face: '♡', burst: ['♥', '✦', '♥'] },
    { id: 'banana', emoji: '🍌', name: '香蕉', reply: '香香的，再来一口！', face: '✦', burst: ['✦', '✧', '✦'] },
    { id: 'lemon', emoji: '🍋', name: '柠檬', reply: '哇，好酸！', face: '﹏', burst: ['ϟ', '✧', 'ϟ'] },
  ];
  const readyText = '我想尝尝你选的水果！';

  function element(tag, name, content) {
    const node = document.createElement(tag);
    node.className = name;
    if (content) node.textContent = content;
    return node;
  }

  function button(name, content) {
    const node = element('button', name, content);
    node.type = 'button';
    return node;
  }

  function decoration(target) {
    target.setAttribute('aria-hidden', 'true');
    return target;
  }

  function mount(container, {img} = {}) {
    const life = new AbortController();
    const on = (target, type, action) => target.addEventListener(type, action, {signal: life.signal});
    const game = element('section', 'play-feed');
    game.setAttribute('aria-label', '给小蚂蚁喂水果');
    const top = element('header', 'play-feed-header');
    const intro = element('div', 'play-feed-intro');
    intro.append(
      element('h2', 'play-feed-title', '小蚂蚁开饭啦'),
      element('p', 'play-feed-guide', '把水果拖到嘴边，或选好水果再点「喂给小蚂蚁」。'),
    );
    const topControls = element('div', 'play-feed-header-controls');
    const counter = element('output', 'play-feed-count');
    const reset = button('play-feed-reset', '重新开始');
    topControls.append(counter, reset);
    top.append(intro, topControls);

    const field = element('div', 'play-feed-field');
    const foliage = decoration(element('div', 'play-feed-leaves'));
    for (let index = 0; index < 5; index++) foliage.append(element('i', 'play-feed-leaf'));

    const tray = element('section', 'play-feed-tray');
    tray.setAttribute('aria-label', '挑选水果');
    const picker = element('div', 'play-feed-picker');
    const tiles = new Map();
    for (const option of fruit) {
      const tile = button(`play-feed-fruit play-feed-fruit-${option.id}`);
      tile.dataset.fruit = option.id;
      tile.setAttribute('aria-pressed', 'false');
      tile.append(
        decoration(element('span', 'play-feed-fruit-emoji', option.emoji)),
        element('span', 'play-feed-fruit-label', option.name),
      );
      tiles.set(option.id, tile);
      picker.append(tile);
    }
    const feedButton = button('play-feed-action', '喂给小蚂蚁');
    tray.append(element('h3', 'play-feed-subtitle', '挑一种水果'), picker, feedButton);

    const stage = element('div', 'play-feed-stage');
    const speech = element('div', 'play-feed-speech');
    const expression = decoration(element('span', 'play-feed-expression', '♪'));
    const status = element('output', 'play-feed-status', readyText);
    status.setAttribute('aria-live', 'polite');
    status.setAttribute('aria-atomic', 'true');
    speech.append(expression, status);

    const ant = element('div', 'play-feed-ant');
    const body = decoration(element('div', 'play-feed-body'));
    body.append(element('span', 'play-feed-fallback', '🐜'));
    if (/^data:image\/(?:png|jpeg|webp|gif|avif);base64,/i.test(img || '')) {
      const artwork = element('img', 'play-feed-art');
      artwork.alt = '';
      artwork.draggable = false;
      on(artwork, 'load', () => ant.classList.add('has-art'));
      artwork.src = img;
      body.append(artwork);
    }
    body.append(element('i', 'play-feed-pucker'));
    const mouth = button('play-feed-mouth');
    mouth.setAttribute('aria-label', '蚂蚁嘴边，放下水果');
    mouth.append(decoration(element('span', 'play-feed-mouth-dot')));
    const bursts = decoration(element('div', 'play-feed-burst'));
    const bits = Array.from({length: 3}, () => element('span', 'play-feed-spark'));
    bursts.append(...bits);
    ant.append(body, bursts, mouth);
    stage.append(speech, ant);
    field.append(foliage, tray, stage);
    game.append(top, field);
    container.append(game);

    let count = 0;
    let selected = null;
    let drag = null;
    let ghost = null;
    let ignorePointerClickUntil = 0;
    let reactionTime = 0;
    let flyingFruit = null;
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

    function updateCount() {
      counter.textContent = `吃了 ${count} 颗`;
      counter.setAttribute('aria-label', `已喂 ${count} 颗水果`);
      reset.hidden = count === 0 && !selected;
    }

    function select(option) {
      selected = option;
      for (const [id, tile] of tiles) tile.setAttribute('aria-pressed', String(id === option?.id));
      game.classList.toggle('has-selection', Boolean(option));
      feedButton.textContent = option ? `喂${option.name}给小蚂蚁` : '喂给小蚂蚁';
      updateCount();
    }

    function stopReaction() {
      window.clearTimeout(reactionTime);
      game.classList.remove('is-reacting');
      flyingFruit?.remove();
      flyingFruit = null;
    }

    function animateFruit(option, point) {
      if (reducedMotion.matches || !point) return;
      const target = mouth.getBoundingClientRect();
      const snack = decoration(element('span', 'play-feed-flight', option.emoji));
      flyingFruit = snack;
      snack.style.setProperty('--snack-x', `${point.x - target.left - target.width / 2}px`);
      snack.style.setProperty('--snack-y', `${point.y - target.top - target.height / 2}px`);
      mouth.append(snack);
    }

    function feed(point) {
      if (!selected) {
        status.textContent = '先挑一个你想喂的水果吧。';
        return;
      }
      stopReaction();
      count++;
      updateCount();
      game.dataset.reaction = selected.id;
      expression.textContent = selected.face;
      status.textContent = selected.reply;
      bits.forEach((part, index) => { part.textContent = selected.burst[index]; });
      // A second serving of the same fruit restarts its animation.
      void game.offsetWidth;
      game.classList.add('is-reacting');
      animateFruit(selected, point);
      reactionTime = window.setTimeout(stopReaction, 1080);
    }

    function feedSelected() {
      const rect = selected && tiles.get(selected.id).getBoundingClientRect();
      feed(rect && {x: rect.left + rect.width / 2, y: rect.top + rect.height / 2});
    }

    function overMouth(x, y) {
      const rect = mouth.getBoundingClientRect();
      const slop = 13;
      return x >= rect.left - slop && x <= rect.right + slop &&
        y >= rect.top - slop && y <= rect.bottom + slop;
    }

    function clearDrag() {
      if (!drag) return;
      const previous = drag;
      drag = null;
      ghost?.remove();
      ghost = null;
      previous.tile.classList.remove('is-dragging');
      game.classList.remove('is-dragging', 'over-mouth');
      if (previous.tile.hasPointerCapture(previous.pointer)) previous.tile.releasePointerCapture(previous.pointer);
    }

    function beginDrag(event, option, tile) {
      if (drag || !event.isPrimary || event.button !== 0) return;
      drag = { option, tile, pointer: event.pointerId, x: event.clientX, y: event.clientY, moved: false };
      tile.setPointerCapture(event.pointerId);
    }

    function moveDrag(event) {
      if (!drag || drag.pointer !== event.pointerId) return;
      if (!drag.moved) {
        if (Math.hypot(event.clientX - drag.x, event.clientY - drag.y) < 7) return;
        drag.moved = true;
        select(drag.option);
        ghost = decoration(element('span', 'play-feed-ghost', drag.option.emoji));
        document.body.append(ghost);
        drag.tile.classList.add('is-dragging');
        game.classList.add('is-dragging');
      }
      ghost.style.left = `${event.clientX}px`;
      ghost.style.top = `${event.clientY}px`;
      game.classList.toggle('over-mouth', overMouth(event.clientX, event.clientY));
    }

    function endDrag(event) {
      if (!drag || drag.pointer !== event.pointerId) return;
      const moved = drag.moved;
      const fed = moved && overMouth(event.clientX, event.clientY);
      clearDrag();
      if (!moved) return;
      // Pointer capture routes the synthetic post-drag click to the fruit button.
      ignorePointerClickUntil = performance.now() + 250;
      if (fed) feed({x: event.clientX, y: event.clientY});
      else status.textContent = '把水果放进嘴边的圆圈里。';
    }

    for (const option of fruit) {
      const tile = tiles.get(option.id);
      on(tile, 'click', event => {
        if (event.detail && performance.now() < ignorePointerClickUntil) return;
        select(option);
        if (!game.classList.contains('is-reacting')) {
          game.removeAttribute('data-reaction');
          expression.textContent = '♪';
          status.textContent = `我准备好尝一口${option.name}啦！`;
        }
      });
      on(tile, 'pointerdown', event => beginDrag(event, option, tile));
      on(tile, 'pointermove', moveDrag);
      on(tile, 'pointerup', endDrag);
      on(tile, 'pointercancel', clearDrag);
      on(tile, 'lostpointercapture', clearDrag);
    }
    on(game, 'keydown', event => {
      if (event.key === 'Escape') clearDrag();
    });
    on(mouth, 'click', feedSelected);
    on(feedButton, 'click', feedSelected);
    on(reset, 'click', () => {
      stopReaction();
      clearDrag();
      count = 0;
      select(null);
      game.removeAttribute('data-reaction');
      expression.textContent = '♪';
      status.textContent = readyText;
      tiles.get(fruit[0].id).focus();
    });
    updateCount();

    return () => {
      stopReaction();
      clearDrag();
      life.abort();
      game.remove();
    };
  }

  window.AntPlayFeed = { mount };
})();

</script>
<script>
(() => {
  'use strict';

  const games = [
    {id:'route', label:'画路线', icon:'✏️', get:() => window.AntPlayRoute},
    {id:'eggs', label:'找彩蛋', icon:'🥚', get:() => window.AntPlayEggs},
    {id:'feed', label:'喂水果', icon:'🍓', get:() => window.AntPlayFeed},
  ];

  function node(tag, attributes = {}, ...children) {
    const element = document.createElement(tag);
    Object.entries(attributes).forEach(([name,value]) => element.setAttribute(name,value));
    element.append(...children);
    return element;
  }

  function mount(container, {img, initial, onPick} = {}) {
    const header = node('header',{class:'playpark-head'},
      node('div',{},node('h1',{},'蚂蚁游乐场'),node('p',{},'挑一样，马上玩。')),
      img ? node('img',{class:'playpark-mascot',src:img,alt:'',draggable:'false'}) : '');
    const tabs = node('div',{class:'playpark-tabs',role:'tablist','aria-label':'游乐场玩法'});
    const host = node('div',{class:'playpark-fields'});
    const entries = games.map(game => {
      const tab = node('button',{class:`playpark-tab playpark-tab--${game.id}`,type:'button',role:'tab',id:`play-tab-${game.id}`,'aria-controls':`play-panel-${game.id}`},
        node('span',{class:'playpark-tab-icon','aria-hidden':'true'},game.icon),node('span',{},game.label));
      const panel = node('div',{class:'playpark-field',id:`play-panel-${game.id}`,role:'tabpanel','aria-labelledby':tab.id,tabindex:'0',hidden:''});
      tabs.append(tab); host.append(panel);
      return {game,tab,panel,dispose:null};
    });
    const park = node('section',{class:'playpark'},header,tabs,host);
    container.append(park);

    function select(index, focus) {
      entries.forEach(({tab,panel},i) => {
        const active = i === index;
        tab.setAttribute('aria-selected',String(active));
        tab.tabIndex = active ? 0 : -1;
        panel.hidden = !active;
      });
      const entry = entries[index];
      if (!entry.dispose) entry.dispose = entry.game.get().mount(entry.panel,{img});
      if (focus) entry.tab.focus({preventScroll:true});
      onPick?.(entry.game.id);
    }
    entries.forEach(({tab},index) => {
      tab.addEventListener('click',() => select(index,false));
      tab.addEventListener('keydown',event => {
        const last = entries.length-1;
        const target = ({ArrowRight:(index+1)%entries.length,ArrowLeft:(index+last)%entries.length,Home:0,End:last})[event.key];
        if (target === undefined) return;
        event.preventDefault(); select(target,true);
      });
    });
    select(Math.max(0,games.findIndex(game => game.id === initial)),false);
    return () => { entries.forEach(entry => entry.dispose?.()); park.remove(); };
  }

  window.AntPlayground = {mount};
})();

</script>

  }
  const cloudReady = Boolean(learner?.name.trim());

  const empty = {completed: [], explored: {}, challenges: {}, attempts: {}, fruits: [], drafts: {}, labMarks: {}, first: null, latest: null, reflection: '', finalized: false, active: 'home', lastStage: '', playMode: 'route'};
  let data = {...empty};

  if (!data.labMarks || typeof data.labMarks !== 'object' || Array.isArray(data.labMarks)) data.labMarks = {};
  const save = () => { try { localStorage.setItem(storageKey, JSON.stringify(data)); } catch { /* browser may disable storage */ } };
  const navigation = [
    ['home','首页'],['faces','数六个面'],['plane','平面寻路'],['cross','跨过一条棱'],['grid','数格比路线'],
    ['unfold','展开找直线'],['exit','出门条'],['challenge','长方体挑战'],['play','蚂蚁游乐场'],
  ];
  const views = {
    faces: ['正方体模型',''], plane: ['蚂蚁赛跑','同起点 · 同速度'],
    cross: ['蚂蚁的跨棱路线','爬行时也可以旋转视角'], grid: ['网格路线比较','点小段做标记'],
    unfold: ['两个面怎样铺平','拖动 P 调整跨棱位置'], challenge: ['长方体网格','旋转查看 · 分开记录'],
  };
  let scene, stageGuide, closePlayground, active, updateTimer, cloudMessage = cloudReady ? '已连接课堂课次，提交后请查看保存回执。' : '本地学习，尚未同步。';
  let assignmentSyncInProgress = false;

  function el(tag, attributes = {}, ...children) {
    const element = document.createElement(tag);
    for (const [key, value] of Object.entries(attributes)) {
      if (key === 'class') element.className = value; else if (key === 'text') element.textContent = value; else element.setAttribute(key, value);
    }
    element.append(...children);
    return element;
  }
  function button(label, action, className = '') {

  }
  function range(label, initial, onInput) {

    return {input, row:el('label',{class:'range-row'},label,input)};
  }
  const formatLength = length => Number.isFinite(length) ? `约 ${length.toFixed(2)} 格` : '—';
  const optionId = index => ['a','b','c','d'][index];
  const score = answers => lesson.exit.reduce((n,question,i) => n + Number(answers?.[i] === optionId(question.correct)),0);

  };
  function exitReview() {

    if (!data.reflection.trim()) return '补写今日收获';
    if (lesson.exit.some(({id},index) => (data.drafts[id] ?? data.latest[index]) !== data.latest[index])) return '订正待提交';
    return score(data.latest) === lesson.exit.length ? '' : '待订正';
  }
  const shapeQuestion = {id:'try-cuboid-shape',prompt:'把滑块拉到底后，六个面还是一样大的正方形吗？',choices:['还是','不是'],correct:1,explanation:'长、宽、高分别是 6、4、3 格。每个面的相邻两条边都不等长，所以六个面都是长方形。'};
  const netsQuestion = {id:'try-cuboid-nets',prompt:'比较图中的两种走法，哪一条较短？',choices:['路线①','路线②','一样长'],correct:0,explanation:'①经过前面和上面，长度为 4 格。②多绕过右面，测得约 4.47 格。所以在这两条路线中，①较短。'};

    for (const word of source.split(/(A|B|P|公共棱|前面|后面|背面|左面|右面|上面|下面|底面)/g)) {
      if (!word) continue;

  function questionForm(question, {formal = false, number = 0, onAnswer} = {}) {
    const id = question.id;
    const field = el('fieldset',{class:'question'});
    const legend = el('legend',{}, formal ? el('span',{class:'answer-number',text:String(number)}) : '', formal ? question.prompt : terms(question.prompt));
    const choices = el('div',{class:'choice-row'});
    const feedback = el('p',{class:'feedback',role:'status',hidden:''});
    field.append(legend);
    const item = formal ? bank.questions[number-1] : null;
    if (item?.images?.[0]) field.append(el('img',{class:'bank-img',src:item.images[0].dataUrl,alt:item.images[0].alt}));
    const prefill = data.drafts[id] ?? (formal ? data.latest?.[number-1] : data.attempts[id]?.at(-1)) ?? '';
    const selected = () => field.querySelector('input:checked')?.value || '';
    const status = (answer, fruit = 0) => {
      if (answer === undefined) { feedback.hidden = true; return; }
      const correct = answer === optionId(question.correct);
      feedback.classList.toggle('wrong',!correct);
      if (correct) feedback.textContent = `✿ 答对了！${fruit ? ' 收到一颗果子。' : ''}${question.explanation}`;
      else if (formal) feedback.textContent = `${answer ? '再想一想。' : '这一题暂未作答。'}${question.explanation}`;
      else feedback.textContent = `再试一次。${window.AntQuests.retryHints[id] || '回到图上看看。'}`;
      feedback.hidden = false;
    };
    question.choices.forEach((choice,i) => {
      const input = el('input',{type:'radio',name:id,value:optionId(i)});
      input.checked = prefill === input.value;
      const commit = () => {
        data.drafts[id] = input.value;
        const correct = input.value === optionId(question.correct);
        let fruit = 0;
        if (!formal) {
          (data.attempts[id] ||= []).push(input.value);
          fruit = correct ? collectFruit([id]) : 0;
          status(input.value,fruit);
        }
        save();
        if (!formal) onAnswer?.(correct,field,fruit);
      };
      input.addEventListener('change',commit);
      input.addEventListener('click',() => {
        if (!formal && input.value === prefill && !data.attempts[id]?.length) commit();
      });
      choices.append(el('label',{class:'choice'},input,choice));
    });
    field.append(choices);
    field.append(feedback);
    if (!formal && data.attempts[id]?.length) status(data.attempts[id].at(-1));
    return {field, selected, status};
  }

  function mountPlaneRace(lab, canvas, report, guide) {
    const labels = ['①','②','③'];

    const prompt = el('p',{class:'race-prompt',tabindex:'-1'},'猜猜哪条路线最先到 B？');
    const choices = el('div',{class:'race-choices',role:'group','aria-label':'竞猜哪条路线先到'});
    const result = el('div',{class:'race-result',hidden:'',tabindex:'-1'});
    const start = button('▶ 开始比赛',() => {
      scene.play();
      canvas.scrollIntoView({block:'nearest'});
    },'primary race-start');
    const goQuiz = button('去答题 →',() => focusQuiz(lab),'primary race-quiz');
    const options = labels.map((label,index) => button(`路线${label}`,() => {
      scene.configure({prediction:index});

    },'race-choice'));
    let lastPhase;

    function onChange(snapshot) {
      const {prediction, playing, shown, arrivals, lengths} = snapshot;
      const phase = shown ? 'result' : playing ? 'racing' : prediction == null ? 'guess' : 'ready';
      if (phase === lastPhase) return;
      lastPhase = phase;
      const activeControl = document.activeElement;
      choices.hidden = phase !== 'guess';
      start.hidden = phase === 'guess' || phase === 'racing';
      result.hidden = phase !== 'result';
      prompt.hidden = phase === 'result';
      goQuiz.hidden = phase !== 'result';
      start.classList.toggle('primary',phase !== 'result');
      const predictionText = `你猜的是路线${labels[prediction]}`;
      if (phase === 'guess') {
        readout.textContent = '';
        guide.point({target:choices,text:'先选一条路线。',side:'above'});
      } else if (phase === 'ready') {
        prompt.textContent = predictionText;
        readout.textContent = '';
        guide.point({target:start,text:'点这里发令！',side:'above'});
      } else if (phase === 'racing') {

        readout.textContent = '';

        if (activeControl === start) prompt.focus({preventScroll:true});
      } else {

        const headline = `🏁 路线${labels[fastest]}最先到！`;
        result.replaceChildren(el('p',{class:'race-winner'},headline),el('ol',{class:'race-ranks'},
          ...arrivals.map((route,index) => el('li',{class:`race-team-${route}`},
            el('span',{},`第${index+1}名`),el('b',{},`路线${labels[route]}`),el('span',{},formatLength(lengths[route]))))));
        readout.textContent = prediction === fastest ? '你猜对啦！直直走的蚂蚁先到。' : `${predictionText}。比一比三条路的长度。`;
        if (activeControl === prompt) result.focus({preventScroll:true});

      report({count:shown ? 1 : 0,total:1,action:phase === 'racing' ? '看看谁先到 B。' : '猜一猜，再让三只蚂蚁比赛。'},'main');

    }
    if (id === 'challenge') {
      const slide = range('拉伸模型',0,value => scene.configure({stretch:value}));
      stretchControls = el('div',{class:'subcontrols',hidden:''},slide.row);
      controls.append(stretchControls);
    }
    if (isUnfold) {
      controls.append(el('div',{class:'lab-tool-group unfold-main'},cross.row,foldButton));
      toolsPanel.append(foldBack,fold.row);
      toolsPanel.append(button('记录这次路线',() => {
        const snapshot = scene.state();
        const table = extra.querySelector('tbody');
        if (table.rows.length >= 3) table.deleteRow(0);
        table.append(el('tr',{},el('td',{},`距棱的左端 ${(snapshot.cross * currentModel.dimensions[0]).toFixed(2)} 格`),el('td',{},formatLength(snapshot.length))));
        extra.querySelector('.table-wrap').hidden = false;
      },'compact'));
      const tableWrap = el('div',{class:'table-wrap',hidden:''},el('table',{},el('caption',{},'我记录的路线'),el('thead',{},el('tr',{},el('th',{},'跨棱位置'),el('th',{},'路线长度'))),el('tbody')));
      extra.append(tableWrap);
    }
    controls.append(more);
    onChange(scene.state());
    return (nextMode) => {
      if (id !== 'challenge' || nextMode === variant) return;
      scene.pause();
      variant = nextMode;
      activity.reset();
      const stretching = nextMode === 'shape';
      mode = stretching ? 'shape' : 'challenge';
      currentModel = nextMode === 'nets' ? window.ChallengeNets.model : lesson.models[nextMode === 'mixed' ? 'mixed' : 'challenge'];
      marksByRoute = loadRouteMarks();
      scene.configure({...flags(),grid:!stretching,showRoute:!stretching,stretch:0});
      routeButtons.forEach(control => { control.hidden = stretching; });
      playback.hidden = stretching || nextMode === 'nets';
      segmentTools.hidden = stretching || nextMode === 'nets';
      more.open = false;
      stretchControls.hidden = !stretching;
      stretchControls.querySelector('input').value = 0;
      onChange(scene.state());
    };
  }

  function go(id) { if (location.hash === `#${id}`) show(id); else location.hash = id; }
  function markDone(id) { if (!data.completed.includes(id)) data.completed.push(id); save(); }
  function renderStage(stage) {
    const quests = window.AntQuests;
    const heading = el('header',{class:'stage-head'},el('h1',{},stage.id === 'faces' ? '正方体有几个面？' : stage.title),
      el('p',{class:'stage-goal'},el('span',{},'目标'),stage.goal),el('span',{class:'time'},stage.optional ? `选做 · ${stage.minutes} 分钟` : `约 ${stage.minutes} 分钟`));
    const content = el('article',{class:'content'},el('h2',{},'动手试一试'));
    const steps = el('ol',{class:'steps'},...stage.steps.map(step => el('li',{},terms(step))));
    const labSlot = el('div',{class:'lab-slot'});
    const extra = el('div',{class:'record-panel'});
    const meter = quests.panel(el);
    const locked = el('p',{class:'quest-locked'},'完成动手任务，题目就会出现。');
    const quizTitle = el('h2',{class:'quest-title',tabindex:'-1'},'题目解锁！');
    const questionBox = el('div');
    const quiz = el('section',{class:'quest-quiz',hidden:''},quizTitle,questionBox);
    const clear = el('div',{class:'quest-clear',hidden:''},el('p',{class:'quest-clear-text',role:'status'},'通关！拿到探索小花。'));
    const takeawayTitle = el('h2',{class:'quest-takeaway-title',id:'stage-takeaway-heading'});
    const takeawayDetail = el('p',{class:'quest-takeaway-detail'});
    const takeaway = el('section',{class:'quest-takeaway',hidden:'','aria-labelledby':takeawayTitle.id},
      el('p',{class:'quest-takeaway-label'},'本关收获'),takeawayTitle,takeawayDetail);
    const index = navigation.findIndex(([id]) => id === stage.id);
    const next = stage.optional ? 'exit' : navigation[index+1][0];
    const goNext = button(stage.optional ? '返回出门条' : '下一关 →',() => go(next),'primary');
    const actions = el('div',{class:'next-actions'},stage.optional ? goNext : button('返回上一页',() => go(navigation[index-1][0]),'quiet'));
    if (!stage.optional) clear.append(goNext);
    content.append(steps,extra,meter.root,locked,quiz,takeaway,clear,actions);
    if (['cross','grid','unfold'].includes(stage.id)) content.prepend(el('p',{class:'lead'},terms(stage.lead)));
    const workshop = el('div',{class:'workshop'},heading,content,labSlot);
    main.append(workshop);
    const guide = window.AntGuide.mount(workshop,{img:mascot});
    stageGuide = guide;

    const questionsFor = variant => {
      if (!stage.optional) return stage.questions;
      return [variant === 'shape' ? shapeQuestion : variant === 'nets' ? netsQuestion : stage.questions[variant === 'mixed' ? 1 : 0]];
    };
    const success = question => data.attempts[question.id]?.at(-1) === optionId(question.correct);
    let key, forms = [], current = [], lastEvidence, activitySeen = false, rewardPending, arrival;
    function passed() { return stage.optional ? Boolean(data.challenges[key]) : data.completed.includes(stage.id); }
    function passedNow() { return passed() && !rewardPending && !current.some(needsCorrection); }
    function removeArrival() {
      arrival?.remove(); arrival = undefined;
      clear.classList.remove('with-arrival');
    }
    function arriveAt(target, message, nextLevel) {
      guide.hide();
      removeArrival();
      arrival = el('div',{class:`quest-arrival${nextLevel ? ' toward-button' : ''}`,role:'status'},
        el('img',{src:mascot,alt:''}),el('span',{},message),el('span',{class:'quest-arrival-arrow','aria-hidden':'true'},nextLevel ? '→' : '↓'));
      if (nextLevel && !stage.optional) clear.classList.add('with-arrival');
      target.before(arrival);
      if (nextLevel) {
        const header = narrowNav.matches ? 60 : 10;
        if (takeaway.getBoundingClientRect().top < header || target.getBoundingClientRect().bottom > innerHeight - 12) {
          takeaway.scrollIntoView({block:'center'});
        }
      } else {
        const targetBounds = target.getBoundingClientRect();
        if (targetBounds.top < 60 || targetBounds.top > innerHeight-108) arrival.scrollIntoView({block:'nearest'});
      }
    }
    function updateQuiz(animateArrival = false) {
      const tally = current.filter(success).length;
      const reviewing = passed() && current.some(needsCorrection);
      quizTitle.textContent = reviewing ? '还有题需要订正' : current.length > 1 ? `题目解锁 · ${tally} / ${current.length} 答对` : '题目解锁！';
      let showNext = true;
      forms.forEach((form,i) => {
        form.field.hidden = !showNext;
        showNext &&= form.field !== rewardPending?.field && data.attempts[current[i].id]?.includes(optionId(current[i].correct));
      });
      const done = passedNow();
      clear.hidden = !done;
      takeaway.hidden = !done;
      if (lastEvidence) meter.update(lastEvidence,true,done);
      if (rewardPending) return;
      if (done) {
        if (animateArrival) arriveAt(goNext,stage.optional ? '带上果子！' : '去下一关！',true);
        else if (!arrival) guide.point({target:goNext,text:stage.optional ? '拿到果子啦！可以返回。' : '带上果子，去下一关！',side:'above'});
      }
      else {
        const next = current.findIndex(reviewing ? needsCorrection : question => !success(question));
        const nextField = forms[next]?.field;
        if (animateArrival && nextField) arriveAt(nextField,'我到下一题啦！',false);
        else if (!arrival && nextField) guide.point({target:nextField.querySelector('legend'),text:reviewing ? '回图上看看，再选一次。' : '轮到你答题啦！',kind:'question',side:'above'});
      }
    }
    function finish() {
      if (passed() || !current.length || !current.every(success)) return false;
      if (stage.optional) data.challenges[key] = true;
      markDone(stage.id);
      updateHeader();
      return true;
    }
    function renderQuiz(variant) {
      if (variant === 'nets') window.ChallengeNets.render(questionBox);
      const summary = stage.optional ? challengeTakeaways[variant] : stage.takeaway;
      takeawayTitle.textContent = summary.title;
      takeawayDetail.replaceChildren(terms(summary.detail));
      forms = current.map(question => questionForm(question,{onAnswer(correct,field,fruit) {
        removeArrival();
        if (passed()) updateHeader();
        if (!fruit) {
          const won = correct && finish();
          updateQuiz(won);
          return;
        }
        const pending = {field};
        rewardPending = pending;
        guide.hide();
        field.disabled = true;
        updateQuiz();
        const rewardAnimation = window.AntAnswerFruit.play(field,{img:mascot,count:fruits.size});
        const strip = field.querySelector('.answer-fruit');
        if (strip && strip.getBoundingClientRect().bottom > innerHeight-10) strip.scrollIntoView({block:'nearest'});
        rewardAnimation.then(reward => {
          if (!field.isConnected || rewardPending !== pending) return;
          rewardPending = undefined;
          field.disabled = false;
          reward.dataset.departed = '';
          finish();
          updateQuiz(true);
        });
      }}));
      questionBox.append(...forms.map(form => form.field));
    }
    function onActivity(evidence, variant) {
      const nextKey = stage.optional ? `challenge:${variant}` : stage.id;
      if (nextKey !== key) {
        removeArrival(); rewardPending = undefined;
        key = nextKey; forms = []; current = questionsFor(variant);
        questionBox.replaceChildren();
        quiz.hidden = true; clear.hidden = true; takeaway.hidden = true;
      }
      lastEvidence = evidence;
      const evidenceKey = stage.id === 'unfold' ? 'unfold:straight' : key;
      const newReward = !data.explored[evidenceKey] && !passed() && evidence.count >= evidence.total;
      if (newReward) { data.explored[evidenceKey] = true; save(); }
      const ready = Boolean(data.explored[evidenceKey] || passed());
      locked.hidden = ready;
      meter.update(evidence,ready,passedNow());
      if (ready && !forms.length) {
        quiz.hidden = false;
        renderQuiz(variant);
        const justifiedPass = finish();
        updateQuiz();
        if (newReward && activitySeen && !['plane','cross','unfold'].includes(stage.id)) requestAnimationFrame(() => {
          if (!quiz.isConnected || key !== nextKey) return;
          const rect = quiz.getBoundingClientRect();
          if (rect.top < 0 || rect.top > innerHeight-105) quiz.scrollIntoView({block:'start'});
          quizTitle.focus({preventScroll:true});
          quests.bloom(justifiedPass ? clear : quizTitle, justifiedPass);
        });
      }
      activitySeen = true;
      return ready;
    }
    const switchModel = mountLab(stage,labSlot,extra,onActivity,guide);
    if (stage.optional) {
      const variants = [
        ['main','只走对角线','先数路线①上的对角线段。','再数路线②，比一比。'],
        ['mixed','边与对角线','点亮两条路线上的小段。','把方格边和对角线分开数。'],
        ['nets','比较两种展开','切换路线①和②。','比较两条路线测得的长度。'],
        ['shape','正方体变长方体','拖动滑块，把方块拉长。','转一转，看看哪些面还一样大。'],
      ];
      const picker = el('select',{'aria-label':'挑战项目',class:'challenge-picker'},
        ...variants.map(([value,label]) => el('option',{value},label)));
      function showTips() {
        const [, , ...tips] = variants.find(([value]) => value === picker.value);
        steps.replaceChildren(...tips.map(tip => el('li',{},tip)));
      }
      picker.addEventListener('change',() => { switchModel(picker.value); showTips(); });
      labSlot.querySelector('.lab-hint').replaceWith(picker);
      showTips();
    }
  }

  function cloudStatus(message) {
    cloudMessage = message;
    const place = document.querySelector('#cloud-status');
    if (place) place.textContent = cloudMessage;
  }
  async function pushReport() {
    if (!cloudReady || !data.reflection.trim() || assignmentSyncInProgress) return;
    assignmentSyncInProgress = true;
    try {
      await completion.exportLink();
      data.finalized = true;
      save();
    } catch (error) { cloudStatus(`课堂记录暂未提交。${error.message}`); }
    finally { assignmentSyncInProgress = false; }
  }
  window.addEventListener('poju:cloud-status',event => {
    const result = event.detail || {};
    if (!cloudReady || typeof result.ok !== 'boolean') return;
    const status = result.ok ? (result.completed ? '最终成绩已保存到课堂。' : '课堂记录已收到。') : '课堂保存暂未确认，请稍后再试。';
    cloudStatus(status);
  });
  function renderExit() {
    main.append(el('header',{class:'stage-head'},el('h1',{},'出门条'),el('span',{class:'time'},'独立作答 · 建议用时 3 分钟')));
    const article = el('article',{class:'exit-layout'});
    const missing = primaryStages.filter(stage => !data.completed.includes(stage.id));
    if (missing.length) {
      const notice = el('p',{class:'notice'},'先完成五项探索，再独立做出门条。');
      article.append(notice,el('div',{class:'next-actions'},button(`继续：${missing[0].title}`,() => go(missing[0].id),'primary')));
      main.append(article);
      return;
    }
    article.append(el('p',{},'请先独立完成这 5 题。提交后可看解析，也可以修改答案再提交。'));
    const form = el('form');
    const qRefs = lesson.exit.map((question,i) => questionForm(question,{formal:true,number:i+1}));
    form.append(...qRefs.map(q => q.field));
    const reflection = el('textarea',{rows:2,required:'',maxlength:'2000',placeholder:'今天你学会了哪一种比较路线的方法？'});
    reflection.value = data.reflection;
    reflection.addEventListener('input',() => {
      reflection.setCustomValidity('');
      data.reflection = reflection.value; save();
      updateSummary();
      updateHeader();
      guideExit();
      if (cloudReady) {
        sdk.setReflection({text:data.reflection}); clearTimeout(updateTimer);
        if (data.finalized && data.reflection.trim()) updateTimer = setTimeout(pushReport,700);
      }
    });
    const summary = el('p',{class:'notice',role:'status'});
    const cloud = el('p',{class:'cloud',id:'cloud-status',role:'status'},cloudMessage);
    const submit = el('button',{class:'primary',type:'submit'},data.latest ? '提交订正' : '提交出门条');
    const actions = el('div',{class:'next-actions'},submit,button('长方体选做挑战',() => go('challenge')));
    form.append(el('label',{class:'reflection'},'今日收获（必填）',reflection),actions,summary,cloud);
    article.append(form); main.append(article);
    const guide = window.AntGuide.mount(article,{img:mascot});
    stageGuide = guide;
    function guideExit() {
      if (data.latest) {
        const review = exitReview();
        if (review === '补写今日收获') guide.point({target:reflection,text:'补写一句你的收获。',kind:'question',side:'above'});
        else if (review === '订正待提交') guide.point({target:submit,text:'改好了就提交订正。',side:'above'});
        else guide.hide();
        return;
      }
      const next = qRefs.find(question => !question.selected());
      if (next) guide.point({target:next.field.querySelector('legend'),text:'自己读题，再选答案。',kind:'question',side:'above'});
      else if (!reflection.value.trim()) guide.point({target:reflection,text:'写一句你的收获。',kind:'question',side:'above'});
      else guide.point({target:submit,text:'答完啦，点这里提交。',side:'above'});
    }
    form.addEventListener('change',event => {
      if (!event.target.matches('input[type="radio"]')) return;
      showResults(); updateHeader(); guideExit();
    });
    function updateSummary() {
      if (!data.latest) return;
      const review = exitReview();
      const current = score(data.latest);
      const text = `首次 ${score(data.first)} / 5 · 最近提交 ${current} / 5 · ${review ? `已提交 · ${review}` : '本次学习完成'}`;
      if (summary.textContent !== text) summary.textContent = text;
    }
    function showResults() {
      if (!data.latest) return;
      qRefs.forEach((q,i) => q.status(q.selected() === data.latest[i] ? data.latest[i] : undefined));
      updateSummary();
      submit.textContent = '提交订正';
    }
    showResults(); guideExit();
    form.addEventListener('submit',async event => {
      event.preventDefault();
      if (!reflection.value.trim()) { reflection.setCustomValidity('请写一句自己的收获。'); reflection.reportValidity(); return; }
      const next = qRefs.map(q => q.selected());
      const before = data.latest;
      const newCorrect = next.some((answer,i) => answer === optionId(lesson.exit[i].correct) && answer !== before?.[i]);
      const gathered = collectFruit(lesson.exit.filter((question,i) => next[i] === optionId(question.correct)).map(question => question.id));
      if (!data.first) data.first = [...next];
      data.latest = [...next];
      if (cloudReady) {
        sdk.setReflection({text:data.reflection});
        bank.questions.forEach((question,i) => {
          const prior = sdk.inspectQuestion(question.id);
          if (before?.[i] === next[i] && prior) return;
          sdk.record({id:question.id,partId:'exit',partTitle:'出门条',title:question.prompt,knowledge:question.knowledge,
            status:next[i] ? question.answers.includes(next[i]) ? 'correct' : 'wrong' : 'blank',answer:next[i]});
        });
      }
      save(); showResults(); updateHeader(); guideExit();
      if (gathered) summary.append(` · 收到 ${gathered} 颗果子`);
      summary.scrollIntoView({block:'nearest'});
      if (newCorrect) window.AntQuests.bloom(summary,score(next) === lesson.exit.length);
      if (cloudReady) await pushReport();
    });
  }

  function show(id) {
    if (!navLinks.has(id)) id = 'home';
    scene?.destroy(); scene = undefined;
    stageGuide?.destroy(); stageGuide = undefined;
    closePlayground?.(); closePlayground = undefined;
    if (primaryStages.some(stage => stage.id === active)) data.lastStage = active;
    active = id; data.active = id; save();
    main.replaceChildren();
    main.classList.toggle('home-page', id === 'home');
    updateHeader();
    if (id === 'home') {
      const next = primaryStages.find(stage => !data.completed.includes(stage.id))?.id || 'exit';
      const target = data.lastStage && !data.completed.includes(data.lastStage) ? data.lastStage : next;
      const hasProgress = Boolean(data.completed.length || Object.keys(data.attempts).length || data.lastStage);
      scene = window.AntHome.render(main,{hasProgress, start:() => go(hasProgress ? target : 'faces')});
    } else if (id === 'play') {
      closePlayground = window.AntPlayground.mount(main,{img:mascot,initial:data.playMode,onPick(mode) {
        if (data.playMode !== mode) { data.playMode = mode; save(); }
      }});
    } else if (id === 'exit') renderExit(); else renderStage(lesson.stages.find(stage => stage.id === id));
    window.scrollTo(0,0);
  }
  if (cloudReady && data.reflection.trim()) sdk.setReflection({text:data.reflection});
  document.querySelector('#guide-toggle').addEventListener('click',() => { toggleRail(false); document.querySelector('#guide').showModal(); });
  document.querySelector('.skip').addEventListener('click',event => { event.preventDefault(); main.focus(); });
  railToggle.addEventListener('click',() => toggleRail(rail.inert, !rail.inert));
  tinyTrail.addEventListener('click',() => {
    toggleRail(true);
    document.querySelector('#fruit-trail').scrollIntoView({block:'nearest'});
  });
  railShade.addEventListener('click',() => toggleRail(false, true));
  document.addEventListener('keydown', event => { if (event.key === 'Escape' && document.body.classList.contains('rail-open')) toggleRail(false, true); });
  narrowNav.addEventListener('change', () => toggleRail(false));
  toggleRail(false);
  document.addEventListener('click',event => {
    const control = event.target.closest('button,a,summary,.choice');
    if (!control || control.matches(':disabled') || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    control.animate([{transform:'translateY(2px) scale(.966)'},{transform:'translateY(-1px) scale(1.025)',offset:.62},{transform:'none'}],
      {duration:235,easing:'cubic-bezier(.16,1,.3,1)'});
  },true);
  window.addEventListener('hashchange',() => { if (location.hash !== '#main') show(location.hash.slice(1)); });
  show(location.hash.slice(1) || data.active);
})();

</script>
</body>
