  <style>:root{color-scheme:light;--ink:#1e2541;--muted:#545e78;--purple:#4435a5;--purple-dark:#33257f;--violet-pale:#ebe9fc;--paper:#f7f7f2;--white:#fff;--line:#dcdde9;--mint:#e5f3ea;--green:#225842;--rose:#f9eeea;--rust:#883f30;--radius:18px;--header:126px}
*{box-sizing:border-box}html{scroll-padding-top:calc(var(--header) + 15px)}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Nunito","Microsoft YaHei UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif;font-size:16px;line-height:1.65}button,input,textarea{font:inherit}button,a,label,input[type="range"]{touch-action:manipulation}a{color:var(--purple)}button{cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:8px 14px;background:var(--white);color:var(--ink);font-weight:650;min-height:42px}button:hover{border-color:#9a91d2;background:#f7f6ff}button:disabled{cursor:default;opacity:.55}button[aria-pressed="true"]{border-color:var(--purple);background:var(--violet-pale);color:var(--purple-dark)}:focus-visible{outline:3px solid #755ee3;outline-offset:3px}p{margin:0 0 14px}h1,h2,h3{line-height:1.25;text-wrap:balance;margin:0}h1{font-size:clamp(2rem,3.6vw,3.1rem);letter-spacing:-.06em;font-weight:860}h2{font-size:1.18rem}h3{font-size:1rem}.skip{position:fixed;top:5px;left:10px;transform:translateY(-180%);background:white;z-index:12;padding:10px}.skip:focus{transform:none}
.mast{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.97);border-bottom:1px solid var(--line);box-shadow:0 3px 13px #28265e07}.mast-inner,.tabs,.page{width:min(1340px,calc(100% - 64px));margin-inline:auto}.mast-inner{height:67px;display:flex;gap:20px;align-items:center}.brand{display:inline-flex;align-items:center;gap:11px;color:var(--ink);text-decoration:none;font-weight:850;white-space:nowrap;font-size:1.08rem}.brand-icon{display:grid;place-items:center;width:36px;height:36px;background:var(--purple);color:white;border-radius:10px;font-size:26px;line-height:1}.mast-progress{display:flex;align-items:center;gap:12px;margin-left:auto;font-size:.83rem;color:var(--muted);white-space:nowrap}.mast-progress progress{width:94px;height:6px;appearance:none;border:0;border-radius:10px;overflow:hidden;background:var(--violet-pale)}progress::-webkit-progress-bar{background:var(--violet-pale)}progress::-webkit-progress-value{background:var(--purple)}progress::-moz-progress-bar{background:var(--purple)}.quiet{border-color:transparent;background:transparent;color:var(--muted);padding:6px 10px;font-size:.87rem;min-height:36px}.tabs{display:flex;align-items:stretch;gap:4px;overflow-x:auto;scrollbar-width:thin}.tab{display:flex;align-items:center;gap:6px;flex:0 0 auto;position:relative;padding:11px 13px 13px;border:0;background:transparent;color:var(--muted);text-decoration:none;font-size:.89rem;font-weight:740;white-space:nowrap}.tab[aria-current="step"]{color:var(--purple-dark);background:linear-gradient(transparent,#eeecfb)}.tab[aria-current="step"]::after{content:"";position:absolute;left:9px;right:9px;bottom:0;height:3px;border-radius:4px;background:var(--purple)}.tab-index{font-variant-numeric:tabular-nums;font-size:.75em;color:var(--muted)}.tab-index.done{color:var(--green);font-size:1em}
.page{padding:38px 0 64px}.stage-head{margin-bottom:22px}.time{display:inline-block;color:var(--muted);font-size:.86rem;margin-top:9px}.workshop{display:grid;grid-template-columns:minmax(300px,.79fr) minmax(430px,1.21fr);gap:clamp(26px,4vw,58px);align-items:start}.content p.lead{font-size:1.07rem;color:var(--muted);margin-bottom:20px}.content h2{margin-bottom:9px}.steps{padding:16px 18px 14px 39px;margin:0 0 22px;background:#eeeee7;border-radius:14px}.steps li{padding-left:4px;margin-bottom:5px}.steps li::marker{font-weight:800;color:var(--purple)}.steps li:last-child{margin-bottom:0}.term{display:inline;background:none;border:0;border-bottom:1px dotted currentColor;border-radius:0;min-height:auto;padding:0 1px;color:var(--purple);font-weight:750;text-decoration:none}.term:hover{background:var(--violet-pale)}.lab-slot{position:sticky;top:calc(var(--header) + 17px);min-width:0}.lab{border:1px solid #d8d9ed;border-radius:var(--radius);overflow:hidden;background:#fff;box-shadow:0 10px 35px #2a28600c}.lab-head{height:auto;min-height:52px;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:13px 18px}.lab-title{font-size:.96rem}.lab-hint{color:var(--muted);font-size:.8rem;text-align:right}.screen{background-color:#f0effe;background-image:radial-gradient(#b7b3d6 0.65px,transparent 0.65px);background-size:17px 17px;overflow:hidden;position:relative}.screen canvas{display:block;width:100%;height:clamp(300px,49vh,530px);touch-action:none;cursor:grab}.screen canvas:active{cursor:grabbing}.screen canvas:focus-visible{outline-offset:-4px}.lab-controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 14px}.lab-controls:empty{display:none}.lab-controls button{min-height:37px;padding:5px 11px;font-size:.86rem}.lab-readout{margin:0;padding:0 16px 13px;color:var(--muted);font-size:.87rem}.lab-readout:empty{display:none}.subcontrols{display:grid;gap:7px;flex-basis:100%;padding:2px 0 0}.range-row{display:flex;align-items:center;gap:9px;font-size:.81rem;color:var(--muted)}.range-row input{flex:1;min-width:80px;accent-color:var(--purple)}.rotate-group{display:flex;gap:4px}.rotate-group button{width:37px;padding:0}.minor{color:var(--muted);font-size:.87rem;margin:8px 0}.soft{background:#f5f4ff}.primary{border-color:var(--purple);background:var(--purple);color:#fff;padding:10px 19px}.primary:hover{border-color:var(--purple-dark);background:var(--purple-dark)}.next-actions{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-top:20px}.compact{padding:3px 9px;min-height:34px;font-size:.86rem}.record-panel{margin:15px 0}.record-panel table{font-size:.9rem}.question{border:0;padding:0;margin:0 0 16px;min-inline-size:0}.question legend{display:block;padding:0;margin-bottom:9px;font-weight:750}.choice-row{display:flex;flex-wrap:wrap;gap:7px}.choice{display:flex;align-items:flex-start;gap:7px;padding:7px 10px;background:#fff;border:1px solid var(--line);border-radius:9px;font-size:.94rem;cursor:pointer;line-height:1.4;min-height:38px}.choice:has(:checked){border-color:var(--purple);background:var(--violet-pale);color:var(--purple-dark)}.choice input{margin:3px 0 0;accent-color:var(--purple);flex:none}.question .check{margin-top:8px}.feedback{font-size:.91rem;padding:10px 13px;border-radius:10px;margin:8px 0 0;background:var(--mint);color:var(--green)}.feedback.wrong{background:var(--rose);color:var(--rust)}.feedback[hidden]{display:none}.takeaway{border-left:4px solid #8173d7;padding:10px 13px;background:#eeecfb;margin:17px 0 0;border-radius:0 9px 9px 0}.takeaway summary{cursor:pointer;font-weight:750;color:var(--purple-dark)}.takeaway p{margin:7px 0 1px}.answer-number{display:inline-grid;place-items:center;border-radius:7px;background:var(--violet-pale);color:var(--purple-dark);width:26px;height:26px;margin-right:8px}.bank-img{display:block;width:100%;max-width:530px;max-height:270px;object-fit:contain;object-position:left center;margin:5px 0 10px;border:1px solid var(--line);border-radius:10px;background:#f9f8ff}.exit-layout{max-width:840px}.exit-layout .question{margin:0;padding:17px 0 14px;border-bottom:1px solid var(--line)}.reflection{display:block;margin:23px 0 0;font-weight:750}.reflection textarea{display:block;width:100%;margin-top:5px;padding:10px 13px;color:var(--ink);border:1px solid var(--line);border-radius:10px;background:white;font-weight:400;resize:vertical;min-height:86px}.notice{padding:13px 15px;background:var(--mint);color:var(--green);border-radius:10px;margin:13px 0}.notice:empty{display:none}.cloud{font-size:.85rem;color:var(--muted);margin:10px 0}.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff}table{border-collapse:collapse;width:100%;text-align:left}caption{padding:9px 12px;background:#eeecfa;color:var(--purple-dark);font-weight:750;text-align:left}th,td{padding:7px 12px;border-bottom:1px solid #eeedf4}tbody tr:last-child td{border-bottom:0}th{color:var(--ink);font-size:.9rem;background:#f9f9fc}dialog{border:1px solid var(--line);border-radius:17px;max-width:min(640px,calc(100% - 26px));max-height:92vh;padding:24px;color:var(--ink);box-shadow:0 14px 60px #2a26565a}dialog::backdrop{background:#21244373}.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}dialog p:last-child{margin:16px 0 0}.optional-tools{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 15px}.explain{margin:16px 0}
@media(max-width:930px){.mast-inner,.tabs,.page{width:calc(100% - 38px)}.page{padding-top:27px}.workshop{grid-template-columns:minmax(250px,1fr) minmax(350px,1.25fr);gap:22px}.screen canvas{height:clamp(270px,45vh,400px)}.lab-head{padding-inline:12px}}
@media(max-width:710px){:root{--header:105px}.mast-inner,.tabs,.page{width:calc(100% - 26px)}.mast-inner{height:56px;gap:7px}.brand{font-size:.94rem;gap:6px}.brand-icon{width:28px;height:28px;font-size:21px}.mast-progress{gap:5px;font-size:.72rem}.mast-progress progress{display:none}.quiet{padding-inline:5px}.tab{font-size:.82rem;padding:9px 9px 10px}.page{padding:20px 0 44px}.stage-head{margin-bottom:13px}h1{font-size:clamp(1.8rem,8vw,2.55rem)}.workshop{display:flex;flex-direction:column;gap:16px}.lab-slot{position:static;width:100%;order:1}.content{width:100%;order:2}.screen canvas{height:clamp(255px,46vh,385px)}.lab-hint{font-size:.74rem}.lab-head{min-height:42px;padding:8px 10px}.lab-controls{padding:9px 10px;gap:6px}.lab-controls button{min-height:39px}.choice{min-height:41px}.lab-readout{padding-inline:11px}.choice-row{gap:6px}}

:root {
  --rail-width: 216px;
  --header: 0px;
  --ink: #172e22;
  --muted: #486053;
  --purple: #216342;
  --purple-dark: #174e32;
  --violet-pale: #e2f2df;
  --paper: #f5f2e9;
  --line: #cddacb;
  --pine: #0a2719;
  --lime: #d4f654;
}

.course-rail {
  position: fixed;
  inset: 0 auto 0 0;
  z-index: 12;
  width: var(--rail-width);
  display: flex;
  flex-direction: column;
  gap: 18px;
  overflow: auto;
  padding: 24px 13px 17px;
  color: #fcf6e4;
  background: radial-gradient(ellipse at 20% 8%, #1c4b2e, transparent 49%), var(--pine);
  scrollbar-color: #507e5c transparent;
}
.rail-brand {
  display: flex;
  gap: 10px;
  align-items: center;
  padding: 10px 7px 16px;
  color: inherit;
  text-decoration: none;
  font-size: 1.13rem;
  font-weight: 850;
  line-height: 1.12;
  white-space: nowrap;
}
.rail-brand-accent { display: block; margin-top: 4px; color: var(--lime); }
.rail-cube {
  display: grid;
  flex: 0 0 39px;
  height: 39px;
  place-items: center;
  color: #153418;
  background: var(--lime);
  border-radius: 12px;
  box-shadow: 0 3px 0 #8fac38;
  font-size: 26px;
}
.rail-links { display: grid; gap: 4px; }
.rail-link {
  display: flex;
  gap: 9px;
  align-items: center;
  min-height: 43px;
  padding: 7px 8px;
  border: 1px solid transparent;
  border-radius: 10px;
  color: #e1eddb;
  text-decoration: none;
  font-size: .94rem;
  font-weight: 720;
  white-space: nowrap;
}
.rail-link:hover { background: #ffffff14; }
.rail-link[aria-current] { color: #fff; background: #2e6340; border-color: #73a45d; box-shadow: inset 3px 0 var(--lime), 0 3px 0 #041b0d; }
.nav-mark {
  width: 24px;
  flex: 0 0 24px;
  color: #9ac699;
  text-align: center;
  font: 750 .84rem/1 'Space Mono', 'Cascadia Mono', monospace;
}
.rail-link[aria-current] .nav-mark, .nav-mark.done { color: var(--lime); }
.rail-footer { display: grid; gap: 12px; margin-top: auto; padding: 10px 7px 2px; }
.rail-progress { display: grid; gap: 7px; color: #c6dac7; font-size: .8rem; }
.rail-progress progress {
  appearance: none; width: 100%; height: 7px; accent-color: var(--lime); border: 0; border-radius: 10px; overflow: hidden;
}
.rail-progress progress::-webkit-progress-bar { background: #31503a; }
.rail-progress progress::-webkit-progress-value { background: var(--lime); }
.rail-progress progress::-moz-progress-bar { background: var(--lime); }
.rail-footer button { justify-self: start; min-height: 36px; font-size: .82rem; color: #e6f2df; background: #173d2a; border-color: #467656; }
.rail-footer button:hover { background: #2a563b; border-color: #94ba78; }
.mobile-bar, .rail-shade { display: none; }

.page { width: auto; max-width: 1620px; margin-inline: var(--rail-width) 0; padding: clamp(19px,2.6vw,40px) clamp(15px,2vw,34px) 54px; }
.workshop { grid-template-columns: minmax(250px,.84fr) minmax(340px,1.16fr); gap: 0 clamp(19px,3vw,42px); }
.lab-slot { top: calc(var(--header) + 15px); }
.page h1 { letter-spacing: -.045em; }
.stage-goal { display: inline-flex; align-items: center; gap: 8px; margin: 11px 9px 0 0; font-size: .94rem; font-weight: 730; }
.stage-goal span { padding: 1px 7px; color: #1a5638; background: #dcebd6; border-radius: 6px; font-size: .76rem; }
.stage-head .time { margin-top: 2px; }
.content p.lead { margin-bottom: 12px; font-size: .98rem; }
.steps { padding-block: 11px; margin-bottom: 20px; background: #e6ede0; }
.record-panel:empty { display: none; }
.lab { border-color: #c9d8c9; }
.lab-controls button { min-height: 43px; }
.screen { background-color: #eff4eb; background-image: linear-gradient(#759a7628 1px,transparent 1px),linear-gradient(90deg,#759a7628 1px,transparent 1px); }
.soft, .takeaway { background: #e5f0e1; }
.takeaway { border-left-color: #6b9f69; }
.choice { min-height: 46px; align-items: center; padding-inline: 12px; box-shadow: 0 2px 0 #d2dbcf; }
.choice input { margin-top: 0; }
.choice:has(:checked) { border-color: #659766; box-shadow: 0 2px 0 #8eae8b; }
.choice:hover, button:hover { border-color: #84a98b; background-color: #edf4e9; }
.primary:hover { color: white; background: var(--purple-dark); }
.primary { box-shadow: 0 3px 0 #153e29; }
:focus-visible { outline: 3px solid #447a41; outline-offset: 3px; }
.course-rail :focus-visible, .home-hero :focus-visible { outline-color: var(--lime); }
button:not(:disabled):active, .rail-link:active, .home-missions a:active, .choice:active, summary:active {
  transform: translateY(2px) scale(.965);
}

.home-page { min-height: 100svh; }
.home-hero {
  position: relative;
  isolation: isolate;
  display: grid;
  grid-template-columns: minmax(0,.87fr) minmax(0,1.13fr);
  align-items: center;
  min-height: clamp(470px,45vw,680px);
  overflow: hidden;
  border: 1px solid #28523a;
  border-radius: 27px;
  background-color: #0c2617;
  background-image: linear-gradient(90deg,#071e13aa 0%,transparent 70%), radial-gradient(ellipse at 68% 43%,#48932956,transparent 61%), var(--forest-art,none);
  background-size: cover;
  background-position: center 67%;
  color: #fff8e5;
  box-shadow: 0 14px 34px #20322423;
}
.home-hero::before {
  content: '';
  position: absolute;
  z-index: -1;
  inset: 0;
  pointer-events: none;
  background: repeating-radial-gradient(ellipse at 83% 32%,transparent 0 24px,#bfdc6d28 25px 26px,transparent 27px 39px);
  mask-image: linear-gradient(100deg,transparent 12%,#000 80%);
}
.home-copy { padding: clamp(26px,4vw,64px) 0 clamp(28px,4vw,64px) clamp(24px,4vw,63px); }
.home-page h1 {
  font-family: 'Archivo Black','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif;
  font-size: clamp(41px,5.6vw,90px);
  letter-spacing: -.072em;
  line-height: 1.02;
  font-weight: 950;
  white-space: nowrap;
  text-shadow: 0 3px 0 #020f09b0;
}
.home-page h1 span { display: block; margin-top: .08em; color: var(--lime); font-size: 1.11em; }
.home-copy p { margin: 23px 0 24px; color: #edf0d9; font-size: clamp(.97rem,1.5vw,1.35rem); font-weight: 570; line-height: 1.55; }
.home-start {
  display: inline-flex;
  align-items: center;
  gap: 18px;
  min-height: 60px;
  padding: 12px 22px;
  border: 1px solid #eaff97;
  border-radius: 14px;
  background: linear-gradient(180deg,#efffa6,var(--lime) 47%,#c0e736);
  color: #173a17;
  box-shadow: 0 5px 0 #709b23,0 11px 25px #030d0a9c, inset 0 2px 2px #f0ffc2;
  font-size: clamp(1rem,1.65vw,1.42rem);
  font-weight: 890;
}
.home-start:hover { background: #e8ff91; border-color: #efffab; }
.home-start:active { box-shadow: 0 2px 0 #709b23,0 5px 16px #030d0a9c; }
.home-demo { min-width: 0; padding: 16px clamp(6px,2.4vw,34px) 24px 0; }
.home-model { position: relative; }
.home-model::before { content: ''; position: absolute; z-index: 0; pointer-events: none; inset: 2% 0 0; background: radial-gradient(ellipse at 50% 86%,#010c08 0%,transparent 33%),radial-gradient(ellipse at 54% 41%,#afef361e 0%,transparent 59%); }
.home-model canvas { display: block; position: relative; z-index: 1; width: 100%; height: clamp(350px,36vw,560px); touch-action: none; cursor: grab; }
.home-model canvas:active { cursor: grabbing; }
.home-controls { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 10px; padding-inline: 10px; }
.home-controls button { min-height: 43px; border-radius: 11px; padding: 7px 12px; font-size: .91rem; }
.home-controls .home-play { color: #142e17; background: #ddf988; border-color: #efffb0; box-shadow: 0 3px 0 #6d992e; }
.home-controls .home-play:hover { background: #edffa6; }
.home-controls .home-reset { color: #f4f8de; background: #1c4934; border-color: #7da373; box-shadow: 0 3px 0 #091d12; }
.home-controls .home-reset:hover { background: #2b5d43; }
.home-controls > span { flex-basis: 100%; text-align: center; color: #ccdcb9; font-size: .8rem; }

.home-missions { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 13px; margin-top: 20px; }
.home-missions a {
  display: flex; align-items: center; gap: 12px; min-height: 88px; padding: 13px 16px; border: 1px solid #abc09b;
  border-radius: 15px; background: #fbf8ec; color: #20422b; text-decoration: none; font-size: clamp(.86rem,1.45vw,1.11rem);
  font-weight: 800; box-shadow: 0 3px 0 #dce3d0;
}
.home-missions a:hover { background: #eef4dc; border-color: #78a070; }
.mission-arrow { margin-left: auto; color: #42764e; font-weight: 750; }
.mission-art { position: relative; display: block; width: 39px; height: 39px; flex: 0 0 39px; }
.mission-solid i { position: absolute; inset: 0; }
.mission-solid i:nth-child(1) { background: #c9ed64; clip-path: polygon(50% 2%,96% 24%,50% 48%,4% 24%); }
.mission-solid i:nth-child(2) { background: #62933c; clip-path: polygon(4% 27%,48% 51%,48% 96%,4% 74%); }
.mission-solid i:nth-child(3) { background: #43a78d; clip-path: polygon(52% 51%,96% 27%,96% 74%,52% 96%); }
.mission-grid { border: 1px solid #618455; border-radius: 5px; background: repeating-linear-gradient(#648d5d40 0 1px,transparent 1px 12px),repeating-linear-gradient(90deg,#648d5d40 0 1px,transparent 1px 12px),#c9e49d; }
.mission-grid i { position: absolute; inset: 0; background: linear-gradient(135deg,transparent 46%,#d27b26 47% 53%,transparent 54%); }
.mission-net { background: #74a96a; clip-path: polygon(33% 0,66% 0,66% 33%,100% 33%,100% 66%,66% 66%,66% 100%,33% 100%,33% 66%,0 66%,0 33%,33% 33%); }
.mission-net i:first-child { position: absolute; inset: 2px; background: repeating-linear-gradient(#47744e66 0 1px,transparent 1px 12px),repeating-linear-gradient(90deg,#47744e66 0 1px,transparent 1px 12px),#d9e998; }
.mission-net i:last-child { position: absolute; inset: 0; background: linear-gradient(145deg,transparent 47%,#dc882a 48% 53%,transparent 54%); }

@media(max-width:1190px) { :root { --rail-width: 183px; } .course-rail { padding-inline: 10px; } }
@media(max-width:990px) {
  :root { --rail-width: 157px; }
  .rail-brand { font-size: 1rem; }
  .rail-link { gap: 5px; font-size: .88rem; }
  .workshop { grid-template-columns: minmax(200px,.8fr) minmax(290px,1.2fr); gap: 0 16px; }
  .home-missions a { padding-inline: 10px; gap: 8px; }
}
@media(max-width:860px) {
  .workshop { display: flex; flex-direction: column; gap: 14px; }
  .workshop>.stage-head { order: 0; margin-bottom: 0; }
  .workshop>.lab-slot { order: 1; position: static; width: 100%; }
  .workshop>.content { order: 2; width: 100%; }
  .home-hero { grid-template-columns: 1fr; }
  .home-copy { padding: 25px 25px 2px; }
  .home-page h1 { font-size: clamp(40px,8.4vw,69px); }
  .home-demo { padding: 0 12px 18px; }
  .home-model canvas { height: clamp(255px,48vw,357px); }
  .home-copy p { margin: 13px 0 14px; }
  .home-start { min-height: 49px; padding-block: 7px; }
  .home-missions { grid-template-columns: 1fr; gap: 9px; margin-top: 13px; }
  .home-missions a { min-height: 63px; }
  .mission-art { scale: .85; }
}
@media(max-width:660px) {
  :root { --rail-width: 0px; --header: 54px; }
  .course-rail { width: min(238px,85vw); transform: translateX(-103%); transition: transform .22s ease; }
  .rail-open .course-rail { transform: translateX(0); box-shadow: 12px 0 30px #071c1485; }
  .mobile-bar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px; justify-content: space-between; padding: 6px 12px; min-height: 54px; color: #eaf3e6; background: var(--pine); }
  .rail-menu { min-height: 40px; padding: 6px 10px; border-color: #578367; background: #1d4a31; color: #eff9ec; font-size: .87rem; }
  .rail-menu:hover { background: #2d6443; }
  .mobile-home { color: inherit; text-decoration: none; font-size: .9rem; font-weight: 750; }
  .rail-shade:not([hidden]) { display: block; position: fixed; inset: 0; z-index: 11; width: 100%; border: 0; border-radius: 0; background: #0b2018a8; }
  .page { padding: 15px 11px 41px; }
  .home-page { min-height: calc(100svh - var(--header)); }
  .home-hero { border-radius: 19px; }
  .home-copy { padding-inline: 19px; }
}
@media(prefers-reduced-motion:reduce) {
  .course-rail { transition: none; }
  button:not(:disabled):active, .rail-link:active, .home-missions a:active, .choice:active, summary:active { transform: none; }
}
@media print { .course-rail,.mobile-bar,.home-controls,.home-start { display:none!important; } .page { margin:0; width:100%; } }

.guide-grip {
  position: absolute;
  width: 22px;
  height: 22px;
  transform: translate(-50%,-50%);
  pointer-events: none;
}
.fruit-trail-tip { margin: 5px 0 0; text-align: center; color: #e0f0ce; font-size: .69rem; }
.rail-footer { padding-inline: 2px; }
#fruit-tiny { display: inline-grid; flex: none; place-items: center; min-height: 38px; padding: 3px; background: #173d2a; border-color: #6d955a; }
.quest-status { border-radius: 17px; }
.quest-clear { border-radius: 15px; }
.quest-status.is-ready .quest-status-title::before { content: '✦'; margin-right: .35em; color: #5d861e; }
@media(max-height:780px) {
  .course-rail { padding-block: 12px 10px; gap: 10px; }
  .rail-brand { padding-block: 6px 9px; }
  .rail-links { gap: 2px; }
  .rail-link { min-height: 35px; padding-block: 5px; }
  .rail-footer { gap: 8px; padding-block: 3px 2px; }
}
@media(max-width:360px) { .mobile-home { font-size: .79rem; } .mobile-bar { gap: 5px; padding-inline: 8px; } }
@media(min-width:661px) { :root { --rail-width: clamp(184px,18.9vw,242px); } }
@media(max-width:660px) { .course-rail { width: min(270px,85vw); } }
#fruit-trail .fruit-trail-label { font-size: .9rem; }
#fruit-trail .fruit-trail-rider { width: 45px; height: 44px; transform: translate(-50%,-71%); }
@media(max-height:700px) { .rail-link { min-height: 32px; } .rail-brand { padding-block: 4px 7px; } }

.quest-arrival {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 45px;
  margin: 9px 0 10px;
  color: #683519;
  font-weight: 850;
}
.quest-arrival img {
  width: 43px;
  height: 41px;
  flex: none;
  object-fit: contain;
  animation: quest-run-in .58s ease-out both;
}
.quest-arrival span:not(.quest-arrival-arrow) { line-height: 1.22; }
.quest-arrival-arrow { font-size: 1.23rem; color: #8a431b; }
.quest-arrival.toward-button { margin: 0; gap: 4px; font-size: .84rem; }
.quest-clear.with-arrival { display: grid; grid-template-columns: 33px minmax(0,1fr) auto; row-gap: 4px; }
.quest-clear.with-arrival::before { grid-row: 1; grid-column: 1; }
.quest-clear.with-arrival .quest-clear-text { grid-row: 1; grid-column: 2 / 4; }
.quest-clear.with-arrival .quest-arrival { grid-row: 2; grid-column: 1 / 3; color: #faffea; }
.quest-clear.with-arrival .quest-arrival-arrow { color: #e5f9a2; }
.quest-clear.with-arrival .primary { grid-row: 2; grid-column: 3; }
@keyframes quest-run-in {
  0% { opacity: 0; transform: translateX(-12px) scale(.68); }
  33% { opacity: 1; transform: translate(-7px,-6px) rotate(-7deg); }
  62% { transform: translate(1px,1px) rotate(7deg); }
  83% { transform: translate(0,-3px); }
  100% { transform: none; }
}
@media(prefers-reduced-motion:reduce) { .quest-arrival img { animation: none; } }

:root {
  --quest-ink: #17452c;
  --quest-leaf: #347544;
  --quest-dark: #175433;
  --quest-lime: #d8f56b;
  --quest-soft: #edf4d8;
  --quest-coral: #e98563;
}

.quest-status {
  min-width: 0;
  padding: 12px 14px;
  border: 1px solid #a5be91;
  border-radius: 14px;
  background: #f0f5e2;
  color: var(--quest-ink);
  box-shadow: inset 0 2px 0 #fff7;
}

.quest-status-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  color: #396142;
  font-size: .81rem;
  font-variant-numeric: tabular-nums;
}

.quest-status-title {
  color: var(--quest-ink);
  font-size: .93rem;
  font-weight: 850;
}

.quest-meter {
  display: block;
  width: 100%;
  height: 9px;
  margin-block: 6px 7px;
  appearance: none;
  overflow: hidden;
  border: 0;
  border-radius: 99px;
  background: #d9e6ce;
  accent-color: var(--quest-leaf);
}

.quest-meter::-webkit-progress-bar { background: #d9e6ce; }
.quest-meter::-webkit-progress-value {
  border-radius: 99px;
  background: linear-gradient(90deg, #478952, #75a939);
  transition: width .23s ease-out;
}
.quest-meter::-moz-progress-bar {
  border-radius: 99px;
  background: linear-gradient(90deg, #478952, #75a939);
}

.quest-action {
  min-block-size: 1.55em;
  margin: 0;
  color: var(--quest-ink);
  font-size: .89rem;
  font-weight: 740;
  line-height: 1.55;
  overflow-wrap: anywhere;
}

.quest-steps {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px 5px;
  padding: 0;
  margin: 7px 0 0;
  list-style: none;
}

.quest-steps:empty { display: none; }
.quest-steps > * {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 2px 7px;
  border: 1px solid #c1d4b2;
  border-radius: 6px;
  background: #fff8;
  color: #3e5d42;
  font-size: .74rem;
  font-weight: 680;
  line-height: 1.4;
}

.quest-steps > .is-done {
  border-color: #88b76d;
  background: #d9edb7;
  color: #214d2a;
}

.quest-status.is-ready {
  border-color: #89a64c;
  background: #e5f4b5;
}

.quest-status.is-ready .quest-meter::-webkit-progress-value {
  background: linear-gradient(90deg, #478952, #557525);
}
.quest-status.is-ready .quest-meter::-moz-progress-bar {
  background: linear-gradient(90deg, #478952, #557525);
}

.quest-locked {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 40px;
  margin: 10px 0 0;
  padding: 7px 10px;
  border: 1px dashed #a3b794;
  border-radius: 9px;
  background: #eaf0e0;
  color: #425f43;
  font-size: .82rem;
  font-weight: 660;
  line-height: 1.4;
}

.quest-quiz {
  margin: 14px 0 0;
  padding: clamp(13px, 2.2vw, 20px);
  border: 2px solid #a5c069;
  border-radius: 15px;
  background: #fbfdf2;
  box-shadow: 0 3px 0 #c5d6a7;
  color: var(--quest-ink);
  animation: quest-reveal .31s cubic-bezier(.18,.75,.28,1) both;
  scroll-margin-block-start: calc(var(--header, 0px) + 14px);
}

.quest-title {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 11px;
  color: var(--quest-dark);
  font-size: 1.12rem;
  font-weight: 850;
  line-height: 1.35;
}

.quest-quiz > :last-child { margin-bottom: 0; }

.quest-takeaway {
  min-width: 0;
  margin-block: 18px 0;
  padding: clamp(16px, 2.5vw, 24px);
  border: 2px solid #99b45f;
  border-radius: 16px;
  background: linear-gradient(135deg, #e7f3ac, #f7fbde);
  color: var(--quest-ink);

.play-feed .play-feed-subtitle {
  margin: 1px 0 12px;
  color: #553b25;
  font-size: clamp(1.1rem, 1.85vw, 1.36rem);
  font-weight: 900;
}

.play-feed-picker {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: clamp(5px, 1vw, 12px);
}

.play-feed .play-feed-fruit {
  display: grid;
  min-width: 0;
  min-height: 92px;
  place-items: center;
  align-content: center;
  gap: 5px;
  padding: 9px 3px;
  border: 1px solid var(--fruit-border);
  border-radius: clamp(11px, 1.65vw, 17px);
  color: #3d3927;
  background: var(--fruit-tint);
  box-shadow: 0 3px 0 var(--fruit-shadow), inset 0 1px 0 #fffaf0;
  font: inherit;
  font-weight: 850;
  line-height: 1.2;
  touch-action: none;
  user-select: none;
  cursor: grab;
}

.play-feed-fruit-berry { --fruit-border: #d8a391; --fruit-tint: #fbe7e3; --fruit-shadow: #dab5a5; }
.play-feed-fruit-banana { --fruit-border: #cdae66; --fruit-tint: #ffedba; --fruit-shadow: #d2b878; }
.play-feed-fruit-lemon { --fruit-border: #abb75d; --fruit-tint: #f3f2b1; --fruit-shadow: #bbbf75; }
.play-feed .play-feed-fruit:hover { background-color: var(--fruit-tint); border-color: #74563b; }
.play-feed .play-feed-fruit[aria-pressed='true'] { box-shadow: 0 3px 0 #8a6838, inset 0 0 0 2px #9d7a43; border-color: #78552d; }
.play-feed .play-feed-fruit.is-dragging { cursor: grabbing; }
.play-feed .play-feed-fruit.is-dragging > :first-child { opacity: .33; }

.play-feed-fruit-label { white-space: nowrap; font-size: clamp(.84rem, 1.18vw, 1.04rem); }
.play-feed-fruit-emoji, .play-feed-ghost, .play-feed-flight {
  font: 2.7rem/1 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif;
}

.play-feed-fruit-emoji { font-size: clamp(1.96rem, 4vw, 3.5rem); }

.play-feed .play-feed-action {
  display: block;
  width: 100%;
  min-height: 45px;
  margin-top: 13px;
  padding: 7px 10px;
  border: 1px solid #2f6650;
  border-radius: 12px;
  background: #f1f8c7;
  box-shadow: 0 3px 0 #9caa6e;
  color: #234a34;
  font: inherit;
  font-weight: 900;
}

.play-feed.has-selection .play-feed-action { background: var(--feed-green); color: #fbffe9; box-shadow: 0 3px 0 #17422c; }
.play-feed .play-feed-action:hover { background: #e4eeaa; }
.play-feed.has-selection .play-feed-action:hover { background: #34734f; }

.play-feed-stage {
  display: grid;
  min-width: 0;
  justify-items: center;
  align-items: center;
  padding: 8px 0 3px;
}

.play-feed-speech {
  position: relative;
  z-index: 2;
  display: flex;
  min-height: 52px;
  max-width: 100%;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 8px clamp(9px, 1.65vw, 17px);
  border: 1px solid #9fb573;
  border-radius: 16px;
  background: #fffbe3;
  box-shadow: 0 4px 0 #79955261;
  color: #284831;
  font-size: clamp(.98rem, 2vw, 1.35rem);
  font-weight: 900;
  line-height: 1.27;
  text-align: center;
}

.play-feed-speech::after {
  content: '';
  position: absolute;
  right: 25%;
  bottom: -7px;
  width: 13px;
  height: 13px;
  transform: rotate(45deg);
  border-right: 1px solid #9fb573;
  border-bottom: 1px solid #9fb573;
  background: inherit;
}

.play-feed-expression { font-size: 1.34em; flex: none; }
.play-feed[data-reaction='berry'] .play-feed-speech { background: #ffe7e4; color: #7c3042; border-color: #bf7c77; }
.play-feed[data-reaction='banana'] .play-feed-speech { background: #fff1bd; color: #62441e; border-color: #a98744; }
.play-feed[data-reaction='lemon'] .play-feed-speech { background: #f3f4b4; color: #454c1e; border-color: #a2a04b; }

.play-feed-ant {
  position: relative;
  isolation: isolate;
  width: min(100%, 272px);
  aspect-ratio: 1;
  margin-top: 10px;
}

.play-feed-ant::after {
  content: '';
  position: absolute;
  z-index: -1;
  inset: auto 3% 4% 4%;
  height: 14%;
  border-radius: 50%;
  background: #304d3b58;
  filter: blur(8px);
}

.play-feed-body, .play-feed-burst { position: absolute; inset: 0; pointer-events: none; }
.play-feed-body { display: grid; place-items: center; transform-origin: 50% 80%; }
.play-feed-art { display: none; width: 100%; height: 100%; object-fit: contain; user-select: none; }
.play-feed-ant.has-art .play-feed-art { display: block; }
.play-feed-ant.has-art .play-feed-fallback { display: none; }
.play-feed-fallback { font: clamp(5.3rem, 14vw, 10rem)/1 'Segoe UI Emoji', 'Apple Color Emoji', sans-serif; }

.play-feed .play-feed-mouth {
  position: absolute;
  z-index: 4;
  top: 52%;
  left: 68%;
  display: grid;
  width: clamp(47px, 7vw, 73px);
  min-width: 0;
  height: auto;
  min-height: 0;
  aspect-ratio: 1;
  place-items: center;
  transform: translate(-50%,-50%);
  padding: 0;
  border: 3px dashed #fef4bd;
  border-radius: 50%;
  background: #fff3ad21;
  box-shadow: 0 0 0 1px #704b32, 0 0 14px #fff5bc;
  touch-action: manipulation;
}

.play-feed-ant:not(.has-art) .play-feed-mouth { top: 54%; left: 62%; }
.play-feed .play-feed-mouth:not(:disabled):active { transform: translate(-50%,-50%) scale(.95); }
.play-feed .play-feed-mouth:hover,
.play-feed.is-dragging .play-feed-mouth {
  border-color: #ffffdc;
  background: #fff3ad50;
  box-shadow: 0 0 0 3px #2f6435, 0 0 21px 9px #efffa0;
}

.play-feed.is-dragging .play-feed-mouth::after {
  content: '放这里';
  position: absolute;
  z-index: 1;
  top: calc(100% + 6px);
  left: 50%;
  transform: translateX(-50%);
  padding: 3px 8px;
  border-radius: 6px;
  background: #2a5437;
  color: #fffad9;
  white-space: nowrap;
  font-size: .84rem;
  font-weight: 900;
}

.play-feed.over-mouth .play-feed-mouth { transform: translate(-50%,-50%) scale(1.14); border-style: solid; background: #fffacb8c; }
.play-feed-mouth-dot { width: 7px; aspect-ratio: 1; border-radius: 50%; background: #ffffd3; opacity: .9; }
.play-feed.is-reacting .play-feed-mouth-dot { opacity: 0; }

.play-feed-pucker {
  position: absolute;
  top: 53%;
  left: 68%;
  display: none;
  width: 9%;
  height: 6%;
  border: 2px solid #e8772f;
  border-radius: 62%;
  transform: translate(-50%, -50%) rotate(-21deg);
  background: #883f23;
  box-shadow: 0 0 2px #d67534;
}

.play-feed[data-reaction='lemon'].is-reacting .has-art .play-feed-pucker { display: block; }
.play-feed.is-reacting[data-reaction='berry'] .play-feed-body { animation: play-feed-bounce .65s cubic-bezier(.28,.66,.33,1) .09s both; }
.play-feed.is-reacting[data-reaction='banana'] .play-feed-body { animation: play-feed-dance .79s ease-in-out .08s both; }
.play-feed.is-reacting[data-reaction='lemon'] .play-feed-body { animation: play-feed-wobble .64s ease-in-out .1s both; }

.play-feed-spark {
  position: absolute;
  z-index: 3;
  top: 33%;
  left: 43%;
  opacity: 0;
  color: #fff6b2;
  font: 900 clamp(1.6rem, 3.4vw, 3.2rem)/1 system-ui, sans-serif;
  text-shadow: 0 0 3px #705331;
}

.play-feed-spark:nth-child(1) { --fly-x: -55px; --fly-y: -56px; }
.play-feed-spark:nth-child(2) { left: 64%; --fly-x: 24px; --fly-y: -71px; }
.play-feed-spark:nth-child(3) { left: 76%; --fly-x: 48px; --fly-y: -48px; }
.play-feed[data-reaction='berry'] .play-feed-spark { color: #f5787d; text-shadow: 0 0 3px #fff5e5; }
.play-feed[data-reaction='lemon'] .play-feed-spark { color: #f9ea69; text-shadow: 0 0 3px #726843; }
.play-feed.is-reacting .play-feed-spark { animation: play-feed-rise .78s ease-out .17s both; }
.play-feed.is-reacting .play-feed-spark:nth-child(2) { animation-delay: .26s; }
.play-feed.is-reacting .play-feed-spark:nth-child(3) { animation-delay: .31s; }

.play-feed-flight {
  position: absolute;
  z-index: 6;
  top: 50%;
  left: 50%;
  pointer-events: none;
  animation: play-feed-swallow .35s ease-in both;
}

.play-feed-ghost {
  position: fixed;
  z-index: 1000;
  transform: translate(-50%,-53%) rotate(-8deg);
  filter: drop-shadow(0 4px 5px #34273476);
  pointer-events: none;
  font-size: clamp(2.3rem, 6vw, 4rem);
}

@keyframes play-feed-bounce {
  0%, 100% { transform: none; }
  24% { transform: scale(1.1, .9); }
  49% { transform: translateY(-16px) scale(.94, 1.08); }
  73% { transform: translateY(2px) scale(1.06, .96); }
}

@keyframes play-feed-dance {
  0%, 100% { transform: none; }
  22% { transform: translateY(-7px) rotate(-8deg); }
  46% { transform: translateY(-10px) rotate(8deg); }
  71% { transform: translateY(-4px) rotate(-5deg); }
}

@keyframes play-feed-wobble {
  0%, 100% { transform: none; }
  20%, 59% { transform: translateX(-7px) rotate(-10deg) scaleY(.96); }
  40%, 76% { transform: translateX(7px) rotate(9deg) scaleY(.96); }
}

@keyframes play-feed-rise {
  0% { opacity: 0; transform: scale(.4); }
  24%, 48% { opacity: 1; }
  100% { opacity: 0; transform: translate(var(--fly-x), var(--fly-y)) scale(.76); }
}

@keyframes play-feed-swallow {
  0% { opacity: 1; transform: translate(calc(-50% + var(--snack-x)), calc(-50% + var(--snack-y))) scale(1); }
  88% { opacity: 1; }
  100% { opacity: 0; transform: translate(-50%, -50%) scale(.09); }
}

@media (max-width: 700px) {
  .play-feed-field { grid-template-columns: minmax(0,1fr); min-height: auto; gap: 12px; padding: 15px; border-radius: 21px; }
  .play-feed-tray { width: min(100%, 410px); justify-self: center; border-radius: 19px; }
  .play-feed .play-feed-fruit { min-height: 67px; padding-block: 6px; gap: 3px; }
  .play-feed .play-feed-subtitle { margin-bottom: 7px; }
  .play-feed .play-feed-action { min-height: 39px; margin-top: 10px; }
  .play-feed-stage { padding-top: 4px; }
  .play-feed-speech { min-height: 42px; }
  .play-feed-ant { width: min(74%, 242px); margin-top: 6px; }
}

@media (max-width: 420px) {
  .play-feed-header { margin-bottom: 12px; gap: 9px; }
  .play-feed-field { padding: 10px; gap: 11px; }
  .play-feed-tray { padding: 11px; }
  .play-feed .play-feed-fruit { min-height: 63px; }
  .play-feed-ant { width: min(68%, 209px); }
}

@media (prefers-reduced-motion: reduce) {
  .play-feed.is-reacting .play-feed-body,
  .play-feed.is-reacting .play-feed-spark,
  .play-feed .play-feed-flight { animation: none !important; }
  .play-feed .play-feed-mouth:not(:disabled):active,
  .play-feed.over-mouth .play-feed-mouth { transform: translate(-50%,-50%); }
}

@media print { .play-feed { display: none; } }

    <p>老师先演示旋转、播放和拖动跨棱点。学生按左侧顺序完成探索和出门条。</p>

/* PojuCompletion v1: complete-question gate for newly authored fixed required quizzes. */
(function (global) {
  'use strict';
  if (global.PojuCompletion) return;
  var questionIds = null;
  function required(value, label) {
    if (typeof value !== 'string' || !value.trim()) throw Error(label + ' 必填');
  }
  function expectedCount() {
    var node = global.document.getElementById('poju-course'), manifest;
    if (!node) throw Error('缺少 poju-course 题目总数配置');
    try { manifest = JSON.parse(node.textContent); } catch (_) { throw Error('poju-course JSON 无效'); }
    if (manifest.schema !== 'poju.course' || manifest.version !== 1) throw Error('poju-course 版本无效');
    if (!Number.isSafeInteger(manifest.expectedQuestionCount) || manifest.expectedQuestionCount <= 0) throw Error('expectedQuestionCount 必须为正整数题数');
    return manifest.expectedQuestionCount;
  }
  function configure(options) {
    var ids = options && options.questionIds;
    if (!Array.isArray(ids) || ids.length !== expectedCount()) throw Error('questionIds 必须列出本次全部必做题，数量须与 expectedQuestionCount 一致');
    var copy = Array.from(ids), seen = new Set();
    copy.forEach(function (id) {
      required(id, '题目 ID');
      if (id.length > 200 || seen.has(id)) throw Error('题目 ID 无效或重复');
      seen.add(id);
    });
    questionIds = copy;
    return api;
  }
  async function exportLink() {
    if (!questionIds) throw Error('请先配置本次完整题目清单');
    if (expectedCount() !== questionIds.length) throw Error('题目清单与 expectedQuestionCount 不一致');
    var sdk = global.PojuReport;
    if (!sdk || typeof sdk.getReport !== 'function' || typeof sdk.exportLink !== 'function') throw Error('请先加载 PojuReport v1');
    var report = sdk.getReport();

    required(report.learner && report.learner.name, '姓名');
    if(report.learner.studentNo != null) required(report.learner.studentNo, '学号');
    required(report.learner && report.learner.id, '学生 ID');
    required(report.course && report.course.id, 'course.id');
    required(report.course && report.course.title, 'course.title');

        forward = unit(lerp(oldForward, newForward, t));

      return { face, position, forward, normal, side, origin: physical(lerp(p, q, fraction), face) };

    function drawAnt(visible) {

    function keyDown(event) {

    const resize = new ResizeObserver(() => {
      draw();

    resize.observe(canvas);
    canvas.addEventListener('pointerdown', pointerDown);
    canvas.addEventListener('pointermove', pointerMove);
    canvas.addEventListener('pointerup', pointerUp);
    canvas.addEventListener('pointercancel', pointerUp);

      canvas.removeEventListener('pointerup', pointerUp);

<script>

  'use strict';
  // Coordinates are in grid units, then scaled uniformly into the drawing area.
  const a = [1, 3], b = [9, 3];
  const curve = Array.from({length: 129}, (_, i) => {
    const t = i / 128;
    return [1 + t * 8, 3 + 2.3 * Math.sin(t * Math.PI)];
  });
  const routes = [[a, b], [a, [4, .9], [6, .9], b], curve];
  const colors = ['#4934a9', '#1c776b', '#a94934'];
  const circled = ['①', '②', '③'];
  const lengths = routes.map(route => route.slice(1).map((p, i) => Math.hypot(p[0] - route[i][0], p[1] - route[i][1])));
  const totals = lengths.map(list => list.reduce((sum, value) => sum + value, 0));
  const arrivalOrder = routes.map((_, i) => i).sort((i, j) => totals[i] - totals[j]);
  const raceDistance = Math.max(...totals);

  function traceRoute(index, distance) {
    const points = routes[index];
    const trace = [points[0]];
    let remaining = distance, head = points[0], heading = 0;
    for (let k = 0; k < lengths[index].length; k++) {
      const start = points[k], end = points[k + 1];
      const step = lengths[index][k];
      const fraction = Math.min(1, remaining / step);
      head = [start[0] + (end[0] - start[0]) * fraction, start[1] + (end[1] - start[1]) * fraction];
      heading = Math.atan2(end[1] - start[1], end[0] - start[0]);

    let route = 0, progress = 0, playing = false, speed = 1, prev, frame = 0, flashFrame = 0, emphasis = '', shown = false;
    let prediction = null;

    function state() {

      if (prev !== undefined) progress = Math.min(1, progress + (now - prev) / duration);
      prev = now;
      if (progress >= 1) { playing = false; shown = true; }

      if (playing) frame = requestAnimationFrame(loop);
    }
    const observer = new ResizeObserver(draw); observer.observe(canvas);
    return {
      state,
      configure(data) {
        if (racing && data.prediction !== undefined) prediction = data.prediction;
        if (!racing && data.route !== undefined && data.route !== route) {
          route = data.route; progress = 0; playing = false; shown = false; cancelAnimationFrame(frame);
        }
        if (data.speed) speed = data.speed;
        draw(); report();
      },
      play() {
        if (playing) return;
        if (progress >= 1) {
          progress = 0;
          if (racing) shown = false;
        }
        playing = true; prev = undefined;
        if (racing) draw();
        report(); frame = requestAnimationFrame(loop);
      },
      pause() { playing = false; cancelAnimationFrame(frame); report(); },
      seek(value) { progress = value; draw(); report(); },
      flash(object) { emphasis = object; draw(); clearTimeout(flashFrame); flashFrame = setTimeout(() => { emphasis = '';draw(); }, 800); },
      destroy() { observer.disconnect(); cancelAnimationFrame(frame); clearTimeout(flashFrame); playing = false; },
    };
  }
  window.AntPlane = {mount};
})();

    { title: '路线①  前面 → 上面', tone: '#b44727', faces: [
      { name: '前面', x: 0, y: 0, w: 6, h: 3 },
      { name: '上面', x: 0, y: 3, w: 6, h: 4 }
    ], flat: [[5, 2], [5, 3], [5, 6]] },
    { title: '路线②  前面 → 右面 → 上面', tone: '#3158a8', faces: [
      { name: '前面', x: -6, y: 0, w: 6, h: 3 },
      { name: '右面', x: 0, y: 0, w: 4, h: 3 },
      { name: '上面', x: 0, y: -6, w: 4, h: 6 }
    ], flat: [[-1, 1], [0, .5], [1, 0], [3, -1]] }
  ];

  function diagram(net) {
    const canvas = document.createElement('canvas');
    const width = 440, height = 382, cell = 36;
    canvas.width = width;
    canvas.height = height;
    canvas.style.cssText = 'display:block;width:100%;height:auto;background:#f7f7ff;border-radius:8px';
    canvas.setAttribute('role', 'img');
    canvas.setAttribute('aria-label', `${net.title}的展开图，路线从 A 点走到 B 点。`);
    const ctx = canvas.getContext('2d');
    const left = Math.min(...net.faces.map(face => face.x));
    const right = Math.max(...net.faces.map(face => face.x + face.w));
    const bottom = Math.min(...net.faces.map(face => face.y));
    const top = Math.max(...net.faces.map(face => face.y + face.h));
    const project = (x, y) => [width / 2 + cell * (x - (left + right) / 2), height / 2 - cell * (y - (bottom + top) / 2)];

    for (const face of net.faces) {
      const [x, y] = project(face.x, face.y + face.h);
      const w = face.w * cell, h = face.h * cell;
      ctx.fillStyle = colors[face.name];
      ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = '#3e65595c';
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let i = 1; i < face.w; i++) { ctx.moveTo(x + i * cell, y); ctx.lineTo(x + i * cell, y + h); }
      for (let i = 1; i < face.h; i++) { ctx.moveTo(x, y + i * cell); ctx.lineTo(x + w, y + i * cell); }
      ctx.stroke();
      ctx.strokeStyle = '#3e6559';
      ctx.lineWidth = 2.3;
      ctx.strokeRect(x, y, w, h);
      ctx.font = 'bold 24px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#20483e';
      // The right-hand sheet bends around two seams, so keep its labels clear of the diagonal.
      const labelX = face.name === '右面' ? .66 : .45;
      const labelY = face.name === '上面' && net.faces.length === 3 ? .62 : .50;
      ctx.fillText(face.name, x + w * labelX, y + h * labelY);
    }

    const screen = net.flat.map(point => project(...point));
    ctx.beginPath();
    ctx.moveTo(...screen[0]);
    for (const point of screen.slice(1)) ctx.lineTo(...point);
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#fffcf2';
    ctx.lineWidth = 11;
    ctx.stroke();
    ctx.strokeStyle = net.tone;
    ctx.lineWidth = 7;
    ctx.stroke();

    for (let index = 0; index < screen.length; index++) {
      const [x, y] = screen[index];
      const isStart = index === 0;
      const endpoint = isStart || index === screen.length - 1;
      ctx.beginPath();
      ctx.arc(x, y, endpoint ? 8 : 6, 0, Math.PI * 2);
      ctx.fillStyle = endpoint ? (isStart ? '#1f573e' : '#703c97') : '#fffdf4';
      ctx.fill();
      ctx.strokeStyle = endpoint ? '#fffdf4' : net.tone;
      ctx.lineWidth = 2;
      ctx.stroke();
      if (endpoint) {
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.font = 'bold 24px system-ui, sans-serif';
        ctx.lineJoin = 'round';
        ctx.strokeStyle = '#fffdf4';
        ctx.lineWidth = 4;
        const label = isStart ? 'A' : 'B';
        ctx.strokeText(label, x + 13, y + (isStart ? 12 : -7));
        ctx.fillText(label, x + 13, y + (isStart ? 12 : -7));
      }
    }
    return canvas;
  }

  function render(container) {
    const block = document.createElement('section');
    block.setAttribute('aria-label', '两种展开方式');
    block.style.cssText = 'margin:12px 0';
    const guide = document.createElement('p');
    guide.style.cssText = 'margin:0 0 9px;font-size:.91rem';
    guide.textContent = '两张图的方格一样大。先找 A、B 和跨棱的位置，再比较两条展开后的线段。';

    const panels = document.createElement('div');
    panels.style.cssText = 'display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%, 185px),1fr));gap:9px';
    for (const net of nets) {
      const figure = document.createElement('figure');
      figure.style.cssText = 'margin:0;min-width:0;padding:8px;border:1px solid #d8d9ed;border-radius:11px;background:#fff';
      const caption = document.createElement('figcaption');
      caption.style.cssText = `color:${net.tone};font-weight:750;font-size:.86rem;margin:0 0 5px`;
      caption.textContent = net.title;
      figure.append(caption, diagram(net));
      panels.append(figure);
    }

    const explanation = document.createElement('details');
    explanation.className = 'takeaway';
    const summary = document.createElement('summary');
    summary.textContent = '看一看怎样比较';
    const reason = document.createElement('p');
    reason.textContent = '路线①沿格线直走，可以数出 4 格。路线②的起点和终点横向已相隔 4 格，终点还偏离了起点所在的横线 2 格。斜着走比只走这 4 格更长，网页测得约 4.47 格。两种走法中，路线①较短。';
    explanation.append(summary, reason);
    block.append(guide, panels, explanation);
    container.append(block);
    return block;
  }

  window.ChallengeNets = { model, render };
})();

</script>
